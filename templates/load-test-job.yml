# Per-case load test step group: read terraform outputs -> start -> warm-up -> load test -> publish.
#
# Only the per-tier values are template parameters. Everything else (service
# connection, history-RG/SA/container/loadtest names) is pipeline-variable scope
# and referenced as $() directly inside the steps.

parameters:
  - name: testCaseId
    type: string
  - name: tier
    type: string
  - name: scenario
    type: string
  - name: umbracoVersion
    type: string
  - name: skipWarmup
    type: boolean
    default: false
  # Logs Ingestion API target (Log Analytics custom table). When DceUri +
  # DcrImmutableId + StreamName are non-empty, publish-load-test-results.ps1
  # mirrors each summary row to the LoadTestSummary_CL custom table so the
  # Workbook can read it. When SeriesStreamName is also non-empty, per-minute
  # Azure Monitor datapoints are mirrored to LoadTestSeries_CL for the
  # workbook's per-run drill-down panel. Empty defaults keep the template
  # backward-compatible if invoked outside the main pipeline.
  - name: logAnalyticsDceUri
    type: string
    default: ''
  - name: logAnalyticsDcrImmutableId
    type: string
    default: ''
  - name: logAnalyticsStreamName
    type: string
    default: ''
  - name: logAnalyticsSeriesStreamName
    type: string
    default: ''

steps:
  - task: PowerShell@2
    displayName: 'Read terraform outputs [${{ parameters.testCaseId }}]'
    env:
      # Env vars sidestep $(var) quote escaping.
      RESOLVED_TEST_CASES: $(resolvedTestCases)
      TEST_CASE_OUTPUTS: $(testCaseOutputs)
    inputs:
      targetType: 'inline'
      script: |
        $resolved = $env:RESOLVED_TEST_CASES | ConvertFrom-Json
        $outputs  = $env:TEST_CASE_OUTPUTS   | ConvertFrom-Json

        $testCaseId = '${{ parameters.testCaseId }}'
        $myCase    = $resolved.$testCaseId
        $tfOut   = $outputs.$testCaseId

        if (-not $myCase)  { Write-Host "##vso[task.logissue type=error]No resolved entry for case $testCaseId"; exit 1 }
        if (-not $tfOut) { Write-Host "##vso[task.logissue type=error]No terraform output entry for case $testCaseId"; exit 1 }

        Write-Host "##vso[task.setvariable variable=hostName]$($tfOut.hostname)"
        Write-Host "##vso[task.setvariable variable=appServiceName]$($tfOut.app_service_name)"
        Write-Host "##vso[task.setvariable variable=appServicePlanId]$($tfOut.app_service_plan_id)"
        Write-Host "##vso[task.setvariable variable=appServiceSku]$($tfOut.app_service_sku)"
        Write-Host "##vso[task.setvariable variable=poolDtuMax]$($tfOut.pool_dtu_max)"
        Write-Host "##vso[task.setvariable variable=sqlDatabaseName]$($tfOut.sql_database_name)"
        Write-Host "##vso[task.setvariable variable=sqlDatabaseId]$($tfOut.sql_database_id)"
        Write-Host "##vso[task.setvariable variable=userAmount]$($myCase.userAmount)"
        Write-Host "##vso[task.setvariable variable=spawnRate]$($myCase.spawnRate)"
        Write-Host "##vso[task.setvariable variable=testDuration]$($myCase.testDuration)"

        # Seeder result is written per-case by install-umbraco-cms-on-appservice.ps1.
        # Empty string is fine: publish-load-test-results.ps1 treats missing/blank as "unknown".
        $seederResultPath = Join-Path "$(System.DefaultWorkingDirectory)" ".seeder-results/$testCaseId.json"
        $seederDurationSeconds = ''
        if (Test-Path $seederResultPath) {
            $seeder = Get-Content $seederResultPath -Raw | ConvertFrom-Json
            # Treat 0 (and any sub-second value that rounds to 0) the same as
            # null — Small/Medium/Large/Massive presets all take minutes, so a
            # 0 reading means the seeder reported ElapsedMs incorrectly (status
            # endpoint bug, field-name change, etc.). Letting 0s through would
            # drag the dashboard median to 0 and hide the real value. Worth
            # warning so the underlying cause gets diagnosed.
            if ($null -ne $seeder.duration_seconds -and [double]$seeder.duration_seconds -gt 0) {
                $seederDurationSeconds = [string]$seeder.duration_seconds
            } elseif ($null -ne $seeder.duration_seconds) {
                Write-Host "##vso[task.logissue type=warning]Seeder result for $testCaseId has duration_seconds=$($seeder.duration_seconds) - dropping as suspect (status=$($seeder.status))"
            }
            Write-Host "Seeder result for $testCaseId | status=$($seeder.status) raw=$($seeder.duration_seconds) used=$seederDurationSeconds"
        } else {
            Write-Host "No seeder result file at $seederResultPath - publishing without duration."
        }
        Write-Host "##vso[task.setvariable variable=seederDurationSeconds]$seederDurationSeconds"

        Write-Host "Case $testCaseId | host=$($tfOut.hostname) users=$($myCase.userAmount) duration=$($myCase.testDuration)s"

  # Stop every other case's App Service before starting this one. Defensive
  # sweep instead of a chain-of-pairs: same-tier siblings share an App Service
  # Plan, so a stale-running sibling would contaminate this case's CPU/RAM
  # measurement. Idempotent on already-stopped apps.
  - task: AzureCLI@2
    displayName: 'Stop other App Services [${{ parameters.testCaseId }}]'
    condition: succeeded()
    env:
      TEST_CASE_OUTPUTS: $(testCaseOutputs)
    inputs:
      azureSubscription: '$(serviceConnection)'
      scriptType: 'pscore'
      scriptLocation: 'scriptPath'
      scriptPath: '$(System.DefaultWorkingDirectory)/scripts/stop-all-app-services.ps1'
      arguments: >
        -ResourceGroupName "$(azureResourceGroup)"
        -ExceptAppService "$(appServiceName)"

  - task: AzureCLI@2
    displayName: 'Start App Service [${{ parameters.testCaseId }}]'
    condition: succeeded()
    inputs:
      azureSubscription: '$(serviceConnection)'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az webapp start -n $(appServiceName) -g $(azureResourceGroup)

  # Skipped when skipWarmup=true — so the test hits a freshly started App Service.
  # Two phases:
  #   Phase 1: poll / until 200 (App Service + Umbraco bootstrap is up).
  #   Phase 2: prime every endpoint the load test will hit. Mirrors the URL
  #            buckets the locustfile reads from /umbraco/api/seederstatus/inventory,
  #            so JIT/route/view caches are warm for every sampler — not just /.
  #            Without this, only Homepage runs against a warm app and the other
  #            samplers absorb cold-start latency into their early measurement
  #            window, inflating run-to-run spread.
  - ${{ if not(parameters.skipWarmup) }}:
    - task: PowerShell@2
      displayName: 'Warm up [${{ parameters.testCaseId }}]'
      condition: succeeded()
      inputs:
        targetType: 'inline'
        script: |
          $hostname = "$(hostName)"
          $base = "https://$hostname"
          $deadline = (Get-Date).AddMinutes(5)
          $ready = $false
          Write-Host "Phase 1: polling $base for 200 (max 5 minutes)..."
          while ((Get-Date) -lt $deadline) {
              try {
                  $resp = Invoke-WebRequest -Uri $base -UseBasicParsing -DisableKeepAlive -TimeoutSec 15
                  if ($resp.StatusCode -eq 200) {
                      Write-Host "App responded 200 - bootstrap complete."
                      $ready = $true
                      break
                  }
                  Write-Host "  status=$($resp.StatusCode), retrying..."
              }
              catch {
                  Write-Host "  not ready yet ($($_.Exception.Message.Split([Environment]::NewLine)[0]))"
              }
              Start-Sleep -Seconds 5
          }
          if (-not $ready) {
              # Fail so the load-test step is skipped; running against an unready app gives misleading metrics.
              Write-Host "##vso[task.logissue type=error]App did not respond 200 within 5 minutes - skipping load test for this case"
              exit 1
          }

          Write-Host ""
          Write-Host "Phase 2: priming all sampler endpoints..."
          $inventoryUrl = "$base/umbraco/api/seederstatus/inventory"
          try {
              $inventory = Invoke-RestMethod -Uri $inventoryUrl -TimeoutSec 30
          }
          catch {
              # Non-fatal: the load test will still run, just without the per-endpoint
              # priming — spread on non-Homepage samplers may be wider on this run.
              Write-Host "##vso[task.logissue type=warning]Inventory probe failed ($($_.Exception.Message)); load test will run against a partially-warmed app."
              return
          }

          # Prime EVERY URL in every bucket. The load test picks via
          # random.choice() across the full bucket, so any URL not warmed here
          # hits first-touch latency during measurement — that's the dominant
          # source of run-to-run noise on p95/p99. Output-cached responses on
          # warmed URLs return in ~5ms; uncached first-touch is 200-600ms.
          # Cost: ~30-60s extra warmup; benefit: measurement starts from a
          # fully-warm cache state.
          $targets = New-Object System.Collections.Generic.List[string]
          foreach ($u in @($inventory.rootSectionUrls))                                                         { if ($u) { $targets.Add($u) } }
          foreach ($u in @($inventory.sampleContentUrls | Where-Object { $_.docType -eq 'Category' } | ForEach-Object url)) { if ($u) { $targets.Add($u) } }
          foreach ($u in @($inventory.sampleContentUrls | Where-Object { $_.docType -eq 'Page' }     | ForEach-Object url)) { if ($u) { $targets.Add($u) } }
          foreach ($u in @($inventory.sampleContentUrls | Where-Object { $_.docType -eq 'Detail' }   | ForEach-Object url)) { if ($u) { $targets.Add($u) } }
          foreach ($u in @($inventory.sampleMediaUrls))                                                         { if ($u) { $targets.Add($u) } }
          Write-Host "  priming $($targets.Count) URL(s) across all buckets"

          foreach ($path in $targets) {
              $absolute = if ($path -match '^https?://') { $path } else { "$base$path" }
              try {
                  $r = Invoke-WebRequest -Uri $absolute -UseBasicParsing -DisableKeepAlive -TimeoutSec 30
                  Write-Host "  primed $absolute -> $($r.StatusCode)"
              }
              catch {
                  Write-Host "  warn: $absolute -> $($_.Exception.Message.Split([Environment]::NewLine)[0])"
              }
          }

          # Prime the contact form route. A 4xx is fine — the goal is to register
          # the route + bind the model + compile the controller, not a real submission.
          try {
              $r = Invoke-WebRequest -Uri "$base/umbraco/api/contactform/submit" -Method Post `
                   -ContentType 'application/json' -Body '{}' `
                   -UseBasicParsing -DisableKeepAlive -TimeoutSec 30 -SkipHttpErrorCheck
              Write-Host "  primed contact form -> $($r.StatusCode)"
          }
          catch {
              Write-Host "  warn: contact form -> $($_.Exception.Message.Split([Environment]::NewLine)[0])"
          }
          Write-Host "Warm-up complete."

  # Load test config is per-case so runs stay distinguishable in the portal.
  # Generation lives in scripts/generate-loadtest-config.ps1 so it's locally
  # testable and the template stays scannable.
  - task: AzureCLI@2
    displayName: 'Generate load test config [${{ parameters.testCaseId }}]'
    condition: succeeded()
    inputs:
      azureSubscription: '$(serviceConnection)'
      scriptType: 'pscore'
      scriptLocation: 'scriptPath'
      scriptPath: '$(System.DefaultWorkingDirectory)/scripts/generate-loadtest-config.ps1'
      arguments: >
        -AppServiceName "$(appServiceName)"
        -ResourceGroupName "$(azureResourceGroup)"
        -HostName "$(hostName)"
        -Scenario "${{ parameters.scenario }}"
        -TestCaseId "${{ parameters.testCaseId }}"
        -EngineInstances $(resolvedEngineInstances)
        -UserAmount $(userAmount)
        -SpawnRate $(spawnRate)
        -TestDuration $(testDuration)
        -AppServicePlanId "$(appServicePlanId)"
        -SqlDatabaseId "$(sqlDatabaseId)"
        -SqlDatabaseName "$(sqlDatabaseName)"
        -OutputDir "$(System.DefaultWorkingDirectory)"

  # Capture the load-test window in UTC ISO 8601 so the publish step can query
  # Azure Monitor for server-side metrics (CPU, DTU, memory) over the same time
  # range. The window is slightly wider than the actual steady-state — it includes
  # ALT engine provisioning and post-test artifact download — but those phases are
  # near-zero load on the SUT, so averages aren't meaningfully skewed.
  - task: PowerShell@2
    displayName: 'Capture load test start time [${{ parameters.testCaseId }}]'
    condition: succeeded()
    inputs:
      targetType: 'inline'
      script: |
        $start = (Get-Date).ToUniversalTime().ToString("o")
        Write-Host "##vso[task.setvariable variable=loadTestStartTime]$start"
        Write-Host "Load test window starts at: $start"

  # continueOnError: an SLO breach here is meaningful data, not a reason to skip the rest.
  # Gates on succeeded() so warmup/config failures skip the load test; publish runs anyway.
  - task: AzureLoadTest@1
    displayName: 'Load Test [${{ parameters.testCaseId }}]'
    condition: succeeded()
    continueOnError: true
    inputs:
      azureSubscription: '$(serviceConnection)'
      loadTestConfigFile: '$(loadTestConfigPath)'
      resourceGroup: '$(historyResourceGroup)'
      loadTestResource: '$(historyLoadTestName)'
      # Scenario is implicit (it's the test); run name is what shows in Compare's run picker.
      # The per-DB DTU cap is in the name explicitly — when poolDtuOverride is set, the run
      # name has to differentiate (e.g. 'Standard 50 DTU' default vs 'Standard 100 DTU' override)
      # or you can't tell override runs apart from default-pairing runs in the portal Compare view.
      loadTestRunName: '${{ parameters.umbracoVersion }} ${{ parameters.tier }} $(poolDtuMax)DTU #$(Build.BuildId)'
      loadTestRunDescription: 'Umbraco ${{ parameters.umbracoVersion }} on $(resolvedDotnetVersion) [${{ parameters.tier }}/${{ parameters.scenario }}], app=$(appServiceSku) sql=$(poolDtuMax)DTU, $(resolvedSeederPreset) preset, $(userAmount) users for $(testDuration)s'

  - task: PowerShell@2
    displayName: 'Capture load test end time [${{ parameters.testCaseId }}]'
    condition: succeededOrFailed()
    inputs:
      targetType: 'inline'
      script: |
        $end = (Get-Date).ToUniversalTime().ToString("o")
        Write-Host "##vso[task.setvariable variable=loadTestEndTime]$end"
        Write-Host "Load test window ends at: $end"

  # Pipeline artifact: per-build, expires with build retention. continueOnError so a
  # blob upload hiccup doesn't lose the rest of the run; history publish below is the
  # long-lived copy.
  - task: PublishBuildArtifacts@1
    displayName: 'Publish run artifacts [${{ parameters.testCaseId }}]'
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      PathtoPublish: '$(System.DefaultWorkingDirectory)/loadTest'
      ArtifactName: 'loadtest-results-$(safeTestCaseId)'
      publishLocation: 'Container'

  # Export to long-lived history storage for cross-run comparison.
  # continueOnError: a storage publish failure shouldn't fail the pipeline (the run
  # data is already in Azure Load Testing and the build artifact); investigate via the step log.
  - task: AzureCLI@2
    displayName: 'Publish to history [${{ parameters.testCaseId }}]'
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      azureSubscription: '$(serviceConnection)'
      scriptType: 'pscore'
      scriptLocation: 'scriptPath'
      scriptPath: '$(System.DefaultWorkingDirectory)/scripts/publish-load-test-results.ps1'
      arguments: >
        -ResultsDir "$(System.DefaultWorkingDirectory)/loadTest"
        -HistoryResourceGroup "$(historyResourceGroup)"
        -StorageAccountName "$(historyStorageAccount)"
        -ContainerName "$(historyContainer)"
        -BuildId "$(Build.BuildId)"
        -Commit "$(Build.SourceVersion)"
        -Branch "$(Build.SourceBranchName)"
        -RunStartedAt "$(System.PipelineStartTime)"
        -UmbracoVersion "${{ parameters.umbracoVersion }}"
        -DotNetVersion "$(resolvedDotnetVersion)"
        -AppServiceSku "$(appServiceSku)"
        -PoolDtuMax $(poolDtuMax)
        -SeederPreset "$(resolvedSeederPreset)"
        -Tier "${{ parameters.tier }}"
        -Scenario "${{ parameters.scenario }}"
        -UserCount $(userAmount)
        -SpawnRate $(spawnRate)
        -DurationSeconds $(testDuration)
        -SkipWarmup "${{ parameters.skipWarmup }}"
        -TestCaseId "${{ parameters.testCaseId }}"
        -LoadTestStartTime "$(loadTestStartTime)"
        -LoadTestEndTime "$(loadTestEndTime)"
        -AppServiceResourceId "$(appServiceResourceId)"
        -AppServicePlanResourceId "$(appServicePlanId)"
        -SqlDatabaseResourceId "$(sqlDatabaseId)"
        -SeederDurationSeconds "$(seederDurationSeconds)"
        -LogAnalyticsDceUri "${{ parameters.logAnalyticsDceUri }}"
        -LogAnalyticsDcrImmutableId "${{ parameters.logAnalyticsDcrImmutableId }}"
        -LogAnalyticsStreamName "${{ parameters.logAnalyticsStreamName }}"
        -LogAnalyticsSeriesStreamName "${{ parameters.logAnalyticsSeriesStreamName }}"
