# Template for running a Locust load test against a single Umbraco version.
# Locust executes on Azure Load Testing managed infrastructure (Standard_D4d_v4 VMs),
# not on the pipeline agent. The pipeline only orchestrates start/stop and passes config.
parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroupName
    type: string
  - name: hostNameVar
    type: string
  - name: appServiceNameVar
    type: string
  - name: umbracoVersionVar
    type: string
  - name: dotnetVersionVar
    type: string
  - name: userAmount
    type: number
  - name: spawnRate
    type: number
    default: 10
  - name: testDuration
    type: string
    default: '300'
  - name: engineInstances
    type: number
    default: 1
  - name: coldStart
    type: boolean
    default: false
  - name: stopPreviousAppServiceVar
    type: string
    default: ''
  - name: testIndex
    type: number

  # Long-lived "history" infrastructure — shared across all pipeline runs.
  # The ALT resource lives here (so portal history persists) and the storage
  # account holds exported per-test metrics + raw artifacts.
  - name: historyResourceGroup
    type: string
  - name: historyLoadTestName
    type: string
  - name: historyStorageAccount
    type: string
  - name: historyContainer
    type: string

  # Test-config metadata — passed through to the publish step so each row in
  # the metrics history is fully labelled and queryable without joins.
  - name: appServiceSku
    type: string
  - name: sqlSku
    type: string
  - name: seederPreset
    type: string

steps:
  # Stop previous app service if specified
  - ${{ if ne(parameters.stopPreviousAppServiceVar, '') }}:
    - task: AzureCLI@2
      displayName: 'Stop previous App Service'
      condition: and(succeeded(), ne(variables['${{ parameters.stopPreviousAppServiceVar }}'], 'null'))
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az webapp stop -n $(${{ parameters.stopPreviousAppServiceVar }}) -g ${{ parameters.resourceGroupName }}

  # Start current app service
  - task: AzureCLI@2
    displayName: 'Start App Service [${{ parameters.testIndex }}]'
    condition: and(succeeded(), ne(variables['${{ parameters.hostNameVar }}'], 'null'))
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az webapp start -n $(${{ parameters.appServiceNameVar }}) -g ${{ parameters.resourceGroupName }}

  # Wait for app to warm up (skip when coldStart is true to test cache warm-up behaviour).
  # Poll the homepage until it returns 200 instead of a fixed sleep — finishes as soon as
  # the app is responsive and bounds the wait at 5 minutes.
  - ${{ if not(parameters.coldStart) }}:
    - task: PowerShell@2
      displayName: 'Warm up [${{ parameters.testIndex }}]'
      condition: and(succeeded(), ne(variables['${{ parameters.hostNameVar }}'], 'null'))
      inputs:
        targetType: 'inline'
        script: |
          $hostname = "$(${{ parameters.hostNameVar }})"
          $url = "https://$hostname"
          $deadline = (Get-Date).AddMinutes(5)
          $ready = $false
          Write-Host "Polling $url for 200 (max 5 minutes)..."
          while ((Get-Date) -lt $deadline) {
              try {
                  $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -DisableKeepAlive -TimeoutSec 15
                  if ($resp.StatusCode -eq 200) {
                      Write-Host "App responded 200 — warm-up complete."
                      $ready = $true
                      break
                  }
                  Write-Host "  status=$($resp.StatusCode), retrying..."
              }
              catch {
                  Write-Host "  not ready yet ($($_.Exception.Message.Split([Environment]::NewLine)[0]))"
              }
              Start-Sleep -Seconds 5
          }
          if (-not $ready) {
              Write-Host "##vso[task.logissue type=warning]App did not respond 200 within 5 minutes; running test anyway"
          }

  # Generate load test config with appComponents for server-side monitoring (CPU, memory, network, disk)
  - task: AzureCLI@2
    displayName: 'Generate ALT config [${{ parameters.testIndex }}]'
    condition: and(succeeded(), ne(variables['${{ parameters.hostNameVar }}'], 'null'))
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        $subscriptionId = az account show --query id -o tsv
        $appServiceName = "$(${{ parameters.appServiceNameVar }})"
        $resourceGroup = "${{ parameters.resourceGroupName }}"
        $appServiceResourceId = "/subscriptions/$subscriptionId/resourceGroups/$resourceGroup/providers/Microsoft.Web/sites/$appServiceName"

        # Find the SQL Server associated with this App Service (same version suffix in naming)
        $sqlServers = az sql server list -g $resourceGroup --query "[].{name:name, id:id}" -o json | ConvertFrom-Json
        $sqlServerResourceId = ""
        $sqlServerName = ""
        if ($sqlServers -and $sqlServers.Count -gt 0) {
          $versionSuffix = $appServiceName -replace ".*-appservice-", ""
          # Anchor with leading "-" and end-of-string to avoid matching e.g. "17_0_1" when looking for "17_0"
          $matchedSql = $sqlServers | Where-Object { $_.name -like "*-$versionSuffix" } | Select-Object -First 1
          if ($matchedSql) {
            $sqlServerResourceId = $matchedSql.id
            $sqlServerName = $matchedSql.name
          }
        }

        # Build appComponents YAML — App Service always, SQL Server if found
        $sqlComponent = ""
        if ($sqlServerResourceId) {
        $sqlComponent = @"
          - resourceId: "$sqlServerResourceId"
            resourceName: "$sqlServerName"
            kind: "v12.0"
            metrics:
              - name: dtu_consumption_percent
                namespace: Microsoft.Sql/servers/databases
                aggregation: Average
              - name: cpu_percent
                namespace: Microsoft.Sql/servers/databases
                aggregation: Average
              - name: physical_data_read_percent
                namespace: Microsoft.Sql/servers/databases
                aggregation: Average
              - name: log_write_percent
                namespace: Microsoft.Sql/servers/databases
                aggregation: Average
              - name: connection_successful
                namespace: Microsoft.Sql/servers/databases
                aggregation: Total
              - name: deadlock
                namespace: Microsoft.Sql/servers/databases
                aggregation: Total
        "@
        }

        $config = @"
        version: v0.1
        testId: umbraco-load-test-${{ parameters.testIndex }}
        displayName: Umbraco Load Test [${{ parameters.testIndex }}]
        testPlan: loadtests/locustfile.py
        testType: Locust
        description: Locust load test for Umbraco
        engineInstances: ${{ parameters.engineInstances }}
        configurationFiles:
          - loadtests/locust.conf
          - loadtests/requirements.txt
        # When you add scenario modules under loadtests/, append them here so
        # ALT uploads them to the test engines alongside the test plan.
        failureCriteria:
          - avg(response_time_ms) > 2000
          - p95(response_time_ms) > 5000
          - percentage(error) > 5
        autoStop:
          errorPercentage: 80
          timeWindow: 60
        env:
          - name: LOCUST_HOST
            value: "https://$(${{ parameters.hostNameVar }})"
          - name: LOCUST_USERS
            value: "${{ parameters.userAmount }}"
          - name: LOCUST_SPAWN_RATE
            value: "${{ parameters.spawnRate }}"
          - name: LOCUST_RUN_TIME
            value: "${{ parameters.testDuration }}"
        appComponents:
          - resourceId: "$appServiceResourceId"
            resourceName: "$appServiceName"
            kind: "app"
            metrics:
              - name: CpuPercentage
                namespace: Microsoft.Web/sites
                aggregation: Average
              - name: MemoryPercentage
                namespace: Microsoft.Web/sites
                aggregation: Average
              - name: HttpResponseTime
                namespace: Microsoft.Web/sites
                aggregation: Average
              - name: Requests
                namespace: Microsoft.Web/sites
                aggregation: Total
              - name: Http5xx
                namespace: Microsoft.Web/sites
                aggregation: Total
              - name: Http4xx
                namespace: Microsoft.Web/sites
                aggregation: Total
        $sqlComponent
        "@

        $configPath = "$(System.DefaultWorkingDirectory)/loadtest-config-${{ parameters.testIndex }}.yaml"
        $config | Out-File -FilePath $configPath -Encoding utf8
        Write-Host "Generated ALT config at: $configPath"
        Write-Host "App Service: $appServiceResourceId"
        if ($sqlServerResourceId) { Write-Host "SQL Server: $sqlServerResourceId" }

  # Run load test via Azure Load Testing (Locust on ALT infrastructure).
  # Uses the long-lived shared ALT resource so run history accumulates across
  # pipeline runs. Run name is enriched with branch + commit + buildId so each
  # run is identifiable in the portal.
  - task: AzureLoadTest@1
    displayName: 'Load Test [${{ parameters.testIndex }}]'
    condition: and(succeeded(), ne(variables['${{ parameters.hostNameVar }}'], 'null'))
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      loadTestConfigFile: '$(System.DefaultWorkingDirectory)/loadtest-config-${{ parameters.testIndex }}.yaml'
      resourceGroup: '${{ parameters.historyResourceGroup }}'
      loadTestResource: '${{ parameters.historyLoadTestName }}'
      loadTestRunName: 'Umbraco $(${{ parameters.umbracoVersionVar }}) - $(Build.SourceBranchName)@$(Build.SourceVersion) - run $(Build.BuildId)'
      loadTestRunDescription: 'Umbraco $(${{ parameters.umbracoVersionVar }}) on $(${{ parameters.dotnetVersionVar }}), ${{ parameters.appServiceSku }} app / ${{ parameters.sqlSku }} SQL, ${{ parameters.seederPreset }} preset, ${{ parameters.userAmount }} users for ${{ parameters.testDuration }}s'

  # Publish results as pipeline artifacts (per-build, expires with build retention)
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Results [${{ parameters.testIndex }}]'
    condition: and(succeededOrFailed(), ne(variables['${{ parameters.hostNameVar }}'], 'null'))
    continueOnError: true
    inputs:
      PathtoPublish: '$(System.DefaultWorkingDirectory)/loadTest'
      ArtifactName: 'loadtest-results-${{ parameters.testIndex }}'
      publishLocation: 'Container'

  # Export to long-lived history storage for cross-run comparison.
  # Writes per-scenario NDJSON rows + raw artifact dump. Failure here doesn't
  # fail the test job — historical export is best-effort.
  - task: AzureCLI@2
    displayName: 'Publish to history [${{ parameters.testIndex }}]'
    condition: and(succeededOrFailed(), ne(variables['${{ parameters.hostNameVar }}'], 'null'))
    continueOnError: true
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'scriptPath'
      scriptPath: '$(System.DefaultWorkingDirectory)/scripts/publish-load-test-results.ps1'
      arguments: >
        -ResultsDir "$(System.DefaultWorkingDirectory)/loadTest"
        -HistoryResourceGroup "${{ parameters.historyResourceGroup }}"
        -StorageAccountName "${{ parameters.historyStorageAccount }}"
        -ContainerName "${{ parameters.historyContainer }}"
        -BuildId "$(Build.BuildId)"
        -Commit "$(Build.SourceVersion)"
        -Branch "$(Build.SourceBranchName)"
        -RunStartedAt "$(System.PipelineStartTime)"
        -UmbracoVersion "$(${{ parameters.umbracoVersionVar }})"
        -DotNetVersion "$(${{ parameters.dotnetVersionVar }})"
        -AppServiceSku "${{ parameters.appServiceSku }}"
        -SqlSku "${{ parameters.sqlSku }}"
        -SeederPreset "${{ parameters.seederPreset }}"
        -UserCount ${{ parameters.userAmount }}
        -SpawnRate ${{ parameters.spawnRate }}
        -DurationSeconds ${{ parameters.testDuration }}
        -ColdStart "${{ parameters.coldStart }}"
        -TestIndex ${{ parameters.testIndex }}
