# Per-case load test step group: read terraform outputs -> start -> warm-up -> load test -> publish.

parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroupName
    type: string
  - name: testCaseId
    type: string
  - name: tier
    type: string
  - name: scenario
    type: string
  - name: umbracoVersion
    type: string
  - name: coldStart
    type: boolean
    default: false
  - name: historyResourceGroup
    type: string
  - name: historyLoadTestName
    type: string
  - name: historyStorageAccount
    type: string
  - name: historyContainer
    type: string
  # Logs Ingestion API target (Log Analytics custom table). When all three are
  # non-empty, publish-load-test-results.ps1 mirrors each summary row to the
  # custom table so the Workbook can read it. Empty defaults keep the template
  # backward-compatible if invoked outside the main pipeline.
  - name: logAnalyticsDceUri
    type: string
    default: ''
  - name: logAnalyticsDcrImmutableId
    type: string
    default: ''
  - name: logAnalyticsStreamName
    type: string
    default: ''
  # engineInstances and seederPreset come in as runtime variables
  # (resolvedEngineInstances / resolvedSeederPreset) emitted by the validate
  # stage's profile resolver. They flow through stage-level variable mappings.

steps:
  - task: PowerShell@2
    displayName: 'Read terraform outputs [${{ parameters.testCaseId }}]'
    env:
      # Env vars sidestep $(var) quote escaping.
      RESOLVED_TEST_CASES: $(resolvedTestCases)
      TEST_CASE_OUTPUTS: $(testCaseOutputs)
    inputs:
      targetType: 'inline'
      script: |
        $resolved = $env:RESOLVED_TEST_CASES | ConvertFrom-Json
        $outputs  = $env:TEST_CASE_OUTPUTS   | ConvertFrom-Json

        $testCaseId = '${{ parameters.testCaseId }}'
        $myCase    = $resolved.$testCaseId
        $tfOut   = $outputs.$testCaseId

        if (-not $myCase)  { Write-Host "##vso[task.logissue type=error]No resolved entry for case $testCaseId"; exit 1 }
        if (-not $tfOut) { Write-Host "##vso[task.logissue type=error]No terraform output entry for case $testCaseId"; exit 1 }

        Write-Host "##vso[task.setvariable variable=hostName]$($tfOut.hostname)"
        Write-Host "##vso[task.setvariable variable=appServiceName]$($tfOut.app_service_name)"
        Write-Host "##vso[task.setvariable variable=appServicePlanId]$($tfOut.app_service_plan_id)"
        Write-Host "##vso[task.setvariable variable=appServiceSku]$($tfOut.app_service_sku)"
        Write-Host "##vso[task.setvariable variable=sqlSku]$($tfOut.sql_sku)"
        Write-Host "##vso[task.setvariable variable=sqlDatabaseName]$($tfOut.sql_database_name)"
        Write-Host "##vso[task.setvariable variable=sqlDatabaseId]$($tfOut.sql_database_id)"
        Write-Host "##vso[task.setvariable variable=userAmount]$($myCase.userAmount)"
        Write-Host "##vso[task.setvariable variable=spawnRate]$($myCase.spawnRate)"
        Write-Host "##vso[task.setvariable variable=testDuration]$($myCase.testDuration)"

        Write-Host "Case $testCaseId | host=$($tfOut.hostname) users=$($myCase.userAmount) duration=$($myCase.testDuration)s"

  # Stop every other case's App Service before starting this one. Defensive
  # sweep instead of a chain-of-pairs: same-tier siblings share an App Service
  # Plan, so a stale-running sibling would contaminate this case's CPU/RAM
  # measurement. Idempotent on already-stopped apps.
  - task: AzureCLI@2
    displayName: 'Stop other App Services [${{ parameters.testCaseId }}]'
    condition: succeeded()
    env:
      TEST_CASE_OUTPUTS: $(testCaseOutputs)
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'scriptPath'
      scriptPath: '$(System.DefaultWorkingDirectory)/scripts/stop-all-app-services.ps1'
      arguments: >
        -ResourceGroupName "${{ parameters.resourceGroupName }}"
        -ExceptAppService "$(appServiceName)"

  - task: AzureCLI@2
    displayName: 'Start App Service [${{ parameters.testCaseId }}]'
    condition: succeeded()
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az webapp start -n $(appServiceName) -g ${{ parameters.resourceGroupName }}

  # Skipped when coldStart=true - so the test hits a freshly started App Service.
  - ${{ if not(parameters.coldStart) }}:
    - task: PowerShell@2
      displayName: 'Warm up [${{ parameters.testCaseId }}]'
      condition: succeeded()
      inputs:
        targetType: 'inline'
        script: |
          $hostname = "$(hostName)"
          $url = "https://$hostname"
          $deadline = (Get-Date).AddMinutes(5)
          $ready = $false
          Write-Host "Polling $url for 200 (max 5 minutes)..."
          while ((Get-Date) -lt $deadline) {
              try {
                  $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -DisableKeepAlive -TimeoutSec 15
                  if ($resp.StatusCode -eq 200) {
                      Write-Host "App responded 200 - warm-up complete."
                      $ready = $true
                      break
                  }
                  Write-Host "  status=$($resp.StatusCode), retrying..."
              }
              catch {
                  Write-Host "  not ready yet ($($_.Exception.Message.Split([Environment]::NewLine)[0]))"
              }
              Start-Sleep -Seconds 5
          }
          if (-not $ready) {
              # Fail so the load-test step is skipped; running against an unready app gives misleading metrics.
              Write-Host "##vso[task.logissue type=error]App did not respond 200 within 5 minutes - skipping load test for this case"
              exit 1
          }

  # Load test config is per-case so runs stay distinguishable in the portal.
  - task: AzureCLI@2
    displayName: 'Generate load test config [${{ parameters.testCaseId }}]'
    condition: succeeded()
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        $subscriptionId = az account show --query id -o tsv
        $appServiceName = "$(appServiceName)"
        $resourceGroup = "${{ parameters.resourceGroupName }}"
        $appServiceResourceId = "/subscriptions/$subscriptionId/resourceGroups/$resourceGroup/providers/Microsoft.Web/sites/$appServiceName"

        # App Service Plan + SQL Database resourceIds, read above.
        # CpuPercentage/MemoryPercentage live on the Plan (Microsoft.Web/serverfarms),
        # not on the site (Microsoft.Web/sites) - so we register the plan as its own
        # appComponent. SQL metrics scope to the database, not the server.
        $appServicePlanId    = "$(appServicePlanId)"
        $sqlDatabaseId       = "$(sqlDatabaseId)"
        $sqlDatabaseName     = "$(sqlDatabaseName)"

        $planComponent = ""
        if ($appServicePlanId) {
        $planComponent = @"
          - resourceId: "$appServicePlanId"
            resourceName: "$appServiceName-plan"
            kind: "app"
            metrics:
              - name: CpuPercentage
                namespace: Microsoft.Web/serverfarms
                aggregation: Average
              - name: MemoryPercentage
                namespace: Microsoft.Web/serverfarms
                aggregation: Average
        "@
        }

        $sqlComponent = ""
        if ($sqlDatabaseId) {
        $sqlComponent = @"
          - resourceId: "$sqlDatabaseId"
            resourceName: "$sqlDatabaseName"
            kind: "v12.0"
            metrics:
              - name: dtu_consumption_percent
                namespace: Microsoft.Sql/servers/databases
                aggregation: Average
              - name: cpu_percent
                namespace: Microsoft.Sql/servers/databases
                aggregation: Average
              - name: physical_data_read_percent
                namespace: Microsoft.Sql/servers/databases
                aggregation: Average
              - name: log_write_percent
                namespace: Microsoft.Sql/servers/databases
                aggregation: Average
              - name: connection_successful
                namespace: Microsoft.Sql/servers/databases
                aggregation: Total
              - name: deadlock
                namespace: Microsoft.Sql/servers/databases
                aggregation: Total
        "@
        }

        # testId scopes the Azure Load Testing "Compare runs" view: one load test per
        # scenario, with every (version, tier) run nested under it so the portal lets
        # you select multiple to overlay. testId pattern is ^[a-z0-9_-]{2,50}$.
        $rawScenario = '${{ parameters.scenario }}'.ToLowerInvariant()
        $scenarioSafe = (($rawScenario -replace '[^a-z0-9]', '-') -replace '-+', '-').Trim('-')
        $testId = "umbraco-lt-$scenarioSafe"

        # safeTestCaseId still identifies this specific case for the build artifact + config file.
        $rawKey = '${{ parameters.testCaseId }}'.ToLowerInvariant()
        $safeKey = (($rawKey -replace '[^a-z0-9]', '-') -replace '-+', '-').Trim('-')
        if ($safeKey.Length -gt 50) { $safeKey = $safeKey.Substring(0, 50) }
        Write-Host "##vso[task.setvariable variable=safeTestCaseId]$safeKey"

        $config = @"
        version: v0.1
        testId: $testId
        displayName: Umbraco load test - ${{ parameters.scenario }}
        testPlan: loadtests/locustfile.py
        testType: Locust
        description: Holds all version/tier runs for the '${{ parameters.scenario }}' scenario; pick runs in 'Compare' to overlay.
        engineInstances: $(resolvedEngineInstances)
        failureCriteria:
          - avg(response_time_ms) > 2000
          - p95(response_time_ms) > 5000
          - percentage(error) > 5
        autoStop:
          errorPercentage: 80
          timeWindow: 60
        env:
          - name: LOCUST_HOST
            value: "https://$(hostName)"
          - name: LOCUST_USERS
            value: "$(userAmount)"
          - name: LOCUST_SPAWN_RATE
            value: "$(spawnRate)"
          - name: LOCUST_RUN_TIME
            value: "$(testDuration)"
        appComponents:
          - resourceId: "$appServiceResourceId"
            resourceName: "$appServiceName"
            kind: "app"
            metrics:
              - name: HttpResponseTime
                namespace: Microsoft.Web/sites
                aggregation: Average
              - name: Requests
                namespace: Microsoft.Web/sites
                aggregation: Total
              - name: Http5xx
                namespace: Microsoft.Web/sites
                aggregation: Total
              - name: Http4xx
                namespace: Microsoft.Web/sites
                aggregation: Total
        $planComponent
        $sqlComponent
        "@

        $configPath = "$(System.DefaultWorkingDirectory)/loadtest-config-$safeKey.yaml"
        $config | Out-File -FilePath $configPath -Encoding utf8
        Write-Host "##vso[task.setvariable variable=loadTestConfigPath]$configPath"

        # Surface resource IDs so the publish step can query Azure Monitor for
        # server-side metrics over the test window.
        Write-Host "##vso[task.setvariable variable=appServiceResourceId]$appServiceResourceId"

        Write-Host "Generated load test config at: $configPath"
        Write-Host "App Service:      $appServiceResourceId"
        if ($appServicePlanId) { Write-Host "App Service Plan: $appServicePlanId" }
        if ($sqlDatabaseId)    { Write-Host "SQL Database:     $sqlDatabaseId" }

  # Capture the load-test window in UTC ISO 8601 so the publish step can query
  # Azure Monitor for server-side metrics (CPU, DTU, memory) over the same time
  # range. The window is slightly wider than the actual steady-state — it includes
  # ALT engine provisioning and post-test artifact download — but those phases are
  # near-zero load on the SUT, so averages aren't meaningfully skewed.
  - task: PowerShell@2
    displayName: 'Capture load test start time [${{ parameters.testCaseId }}]'
    condition: succeeded()
    inputs:
      targetType: 'inline'
      script: |
        $start = (Get-Date).ToUniversalTime().ToString("o")
        Write-Host "##vso[task.setvariable variable=loadTestStartTime]$start"
        Write-Host "Load test window starts at: $start"

  # continueOnError: an SLO breach here is meaningful data, not a reason to skip the rest.
  # Gates on succeeded() so warmup/config failures skip the load test; publish runs anyway.
  - task: AzureLoadTest@1
    displayName: 'Load Test [${{ parameters.testCaseId }}]'
    condition: succeeded()
    continueOnError: true
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      loadTestConfigFile: '$(loadTestConfigPath)'
      resourceGroup: '${{ parameters.historyResourceGroup }}'
      loadTestResource: '${{ parameters.historyLoadTestName }}'
      # Scenario is implicit (it's the test); run name is what shows in Compare's run picker.
      # SQL SKU is in the name explicitly — when sqlSkuOverride is set, the run name has to
      # differentiate (e.g. 'Standard S2' default vs 'Standard S3' override) or you can't tell
      # override runs apart from default-pairing runs in the portal Compare view.
      loadTestRunName: '${{ parameters.umbracoVersion }} ${{ parameters.tier }} $(sqlSku) #$(Build.BuildId)'
      loadTestRunDescription: 'Umbraco ${{ parameters.umbracoVersion }} on $(resolvedDotnetVersion) [${{ parameters.tier }}/${{ parameters.scenario }}], app=$(appServiceSku) sql=$(sqlSku), $(resolvedSeederPreset) preset, $(userAmount) users for $(testDuration)s'

  - task: PowerShell@2
    displayName: 'Capture load test end time [${{ parameters.testCaseId }}]'
    condition: succeededOrFailed()
    inputs:
      targetType: 'inline'
      script: |
        $end = (Get-Date).ToUniversalTime().ToString("o")
        Write-Host "##vso[task.setvariable variable=loadTestEndTime]$end"
        Write-Host "Load test window ends at: $end"

  # Pipeline artifact: per-build, expires with build retention. continueOnError so a
  # blob upload hiccup doesn't lose the rest of the run; history publish below is the
  # long-lived copy.
  - task: PublishBuildArtifacts@1
    displayName: 'Publish run artifacts [${{ parameters.testCaseId }}]'
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      PathtoPublish: '$(System.DefaultWorkingDirectory)/loadTest'
      ArtifactName: 'loadtest-results-$(safeTestCaseId)'
      publishLocation: 'Container'

  # Export to long-lived history storage for cross-run comparison.
  # continueOnError: a storage publish failure shouldn't fail the pipeline (the run
  # data is already in Azure Load Testing and the build artifact); investigate via the step log.
  - task: AzureCLI@2
    displayName: 'Publish to history [${{ parameters.testCaseId }}]'
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'scriptPath'
      scriptPath: '$(System.DefaultWorkingDirectory)/scripts/publish-load-test-results.ps1'
      arguments: >
        -ResultsDir "$(System.DefaultWorkingDirectory)/loadTest"
        -HistoryResourceGroup "${{ parameters.historyResourceGroup }}"
        -StorageAccountName "${{ parameters.historyStorageAccount }}"
        -ContainerName "${{ parameters.historyContainer }}"
        -BuildId "$(Build.BuildId)"
        -Commit "$(Build.SourceVersion)"
        -Branch "$(Build.SourceBranchName)"
        -RunStartedAt "$(System.PipelineStartTime)"
        -UmbracoVersion "${{ parameters.umbracoVersion }}"
        -DotNetVersion "$(resolvedDotnetVersion)"
        -AppServiceSku "$(appServiceSku)"
        -SqlSku "$(sqlSku)"
        -SeederPreset "$(resolvedSeederPreset)"
        -Tier "${{ parameters.tier }}"
        -Scenario "${{ parameters.scenario }}"
        -UserCount $(userAmount)
        -SpawnRate $(spawnRate)
        -DurationSeconds $(testDuration)
        -ColdStart "${{ parameters.coldStart }}"
        -TestCaseId "${{ parameters.testCaseId }}"
        -LoadTestStartTime "$(loadTestStartTime)"
        -LoadTestEndTime "$(loadTestEndTime)"
        -AppServiceResourceId "$(appServiceResourceId)"
        -AppServicePlanResourceId "$(appServicePlanId)"
        -SqlDatabaseResourceId "$(sqlDatabaseId)"
        -LogAnalyticsDceUri "${{ parameters.logAnalyticsDceUri }}"
        -LogAnalyticsDcrImmutableId "${{ parameters.logAnalyticsDcrImmutableId }}"
        -LogAnalyticsStreamName "${{ parameters.logAnalyticsStreamName }}"
