parameters:
  - name: umbracoVersion
    type: string
  - name: scenario
    type: string
  - name: workload
    type: string
  - name: loadProfile
    type: string
  - name: resourcePrefix
    type: string
  - name: azureRegion
    type: string
  - name: runStarter
    type: boolean
  - name: runStandard
    type: boolean
  - name: runPro
    type: boolean
  - name: runEnterprise
    type: boolean
  - name: poolDtuOverride
    type: string
  - name: appSkuOverride
    type: string
  - name: seederPresetOverride
    type: string

stages:
  - stage: validateTestCases
    displayName: Validate test cases
    jobs:
      - job: prepareTestCases
        displayName: Validate + resolve test cases
        steps:
          # The repo's own tests, first because they need no credentials and take
          # seconds: a broken helper should fail here, not after provisioning.
          - task: PowerShell@2
            displayName: 'Run helper self-check + unit tests'
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'

                & "$(System.DefaultWorkingDirectory)/scripts/_selfcheck.ps1"
                # Truthiness, not -ne 0: $LASTEXITCODE is $null until something
                # sets it, and $null -ne 0 is true - which read a clean run as a
                # failure. Both $null and 0 are falsy here.
                if ($LASTEXITCODE) { throw "scripts/_selfcheck.ps1 reported failures (exit $LASTEXITCODE)." }

                # Suites are Pester 5 syntax; agents ship v3. An INSTALL failure
                # only warns; a TEST failure fails the stage.
                $pester = Get-Module -ListAvailable Pester |
                    Where-Object { $_.Version.Major -ge 5 } |
                    Sort-Object Version -Descending |
                    Select-Object -First 1
                if (-not $pester) {
                    try {
                        Install-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 `
                            -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
                        $pester = Get-Module -ListAvailable Pester |
                            Where-Object { $_.Version.Major -ge 5 } |
                            Sort-Object Version -Descending |
                            Select-Object -First 1
                    } catch {
                        Write-Host "##vso[task.logissue type=warning]Couldn't install Pester 5 ($($_.Exception.Message)); skipping the Pester suites. The self-check above still ran."
                    }
                }
                if ($pester) {
                    Import-Module Pester -MinimumVersion 5.0.0 -Force
                    Write-Host "Using Pester $($pester.Version)"
                    $cfg = New-PesterConfiguration
                    $cfg.Run.Path     = "$(System.DefaultWorkingDirectory)/scripts/tests"
                    $cfg.Run.Throw    = $true      # non-zero on failure
                    $cfg.Output.Verbosity = 'Detailed'
                    Invoke-Pester -Configuration $cfg
                }

          - task: PowerShell@2
            name: out
            displayName: Resolve profile + validate scenario
            inputs:
              targetType: 'filePath'
              filePath: '$(System.DefaultWorkingDirectory)/scripts/resolve-run-config.ps1'
              arguments: >
                -Profile '${{ parameters.loadProfile }}'
                -UmbracoVersion '${{ parameters.umbracoVersion }}'
                -Scenario '${{ parameters.scenario }}'
                -RunStarter '${{ parameters.runStarter }}'
                -RunStandard '${{ parameters.runStandard }}'
                -RunPro '${{ parameters.runPro }}'
                -RunEnterprise '${{ parameters.runEnterprise }}'
                -PoolDtuOverride '${{ parameters.poolDtuOverride }}'
                -AppSkuOverride '${{ parameters.appSkuOverride }}'
                -SeederPresetOverride '${{ parameters.seederPresetOverride }}'
                -Workload '${{ parameters.workload }}'
                -WorkspaceRoot '$(System.DefaultWorkingDirectory)'

  - stage: ensureHistoryInfra
    displayName: Ensure history infrastructure
    dependsOn: validateTestCases
    jobs:
      - job: ensure
        displayName: Ensure history RG, Azure Load Testing, storage
        steps:
          - task: AzureCLI@2
            displayName: Ensure history infra
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'scriptPath'
              scriptPath: '$(System.DefaultWorkingDirectory)/scripts/ensure-history-infra.ps1'
              arguments: >
                -HistoryResourceGroup "$(historyResourceGroup)"
                -HistoryLocation "$(historyLocation)"
                -LoadTestName "$(historyLoadTestName)"
                -StorageAccountName "$(historyStorageAccount)"
                -ContainerName "$(historyContainer)"

  - stage: ensureMonitoringInfra
    displayName: Ensure monitoring infrastructure
    dependsOn: ensureHistoryInfra
    jobs:
      - job: ensure
        displayName: Ensure Log Analytics + custom table + DCR + Workbook
        steps:
          - task: AzureCLI@2
            name: ensureMon
            displayName: Ensure monitoring infra (workspace, table, DCR, role grant)
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              # addSpnToEnvironment exposes the service connection's app ID via
              # $env:servicePrincipalId; we resolve the SP's *object* ID from
              # that for the role assignment.
              addSpnToEnvironment: true
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $PSNativeCommandUseErrorActionPreference = $true

                if ([string]::IsNullOrWhiteSpace($env:servicePrincipalId)) {
                    Write-Error "servicePrincipalId env var not set. Verify addSpnToEnvironment: true on this task."
                    exit 1
                }
                $spObjectId = az ad sp show --id $env:servicePrincipalId --query id -o tsv
                if ([string]::IsNullOrWhiteSpace($spObjectId)) {
                    Write-Error "Couldn't resolve SP object ID from app ID $env:servicePrincipalId. Tenant may require explicit Directory Readers role on the SP."
                    exit 1
                }
                & "$(System.DefaultWorkingDirectory)/scripts/ensure-monitoring-infra.ps1" `
                    -HistoryResourceGroup "$(historyResourceGroup)" `
                    -HistoryLocation "$(historyLocation)" `
                    -WorkspaceName "$(historyWorkspaceName)" `
                    -DceName "$(historyDceName)" `
                    -DcrName "$(historyDcrName)" `
                    -IngestPrincipalId $spObjectId `
                    -EmitPipelineVars

          - task: AzureCLI@2
            displayName: Deploy Workbook (idempotent — re-applies dashboards/loadtest.workbook.json)
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'scriptPath'
              scriptPath: '$(System.DefaultWorkingDirectory)/scripts/deploy-workbook.ps1'
              arguments: >
                -HistoryResourceGroup "$(historyResourceGroup)"
                -HistoryLocation "$(historyLocation)"
                -WorkspaceName "$(historyWorkspaceName)"

  - stage: provision
    displayName: Provision infrastructure
    dependsOn:
      - validateTestCases
      - ensureHistoryInfra
    variables:
      testCasesJson:            $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.testCasesJson'] ]
      resolvedSeederPreset:     $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedSeederPreset'] ]
      resolvedPoolDtuOverride:  $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedPoolDtuOverride'] ]
      resolvedAppSkuOverride:   $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedAppSkuOverride'] ]
      resolvedSdkVersion:       $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedSdkVersion'] ]
    jobs:
      - job: checkResourceGroup
        displayName: Check if resource group exists
        steps:
          - task: AzureCLI@2
            displayName: Fail if resource group already exists
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Fail if the RG already exists — either a stuck previous run or a prefix collision.
                # If it's a stuck run you want to discard, delete it directly:
                #   az group delete -n <name> --yes
                # then re-queue this pipeline.
                $exists = az group exists -n $(azureResourceGroup)
                if ($exists -eq 'true') {
                  Write-Host "##vso[task.logissue type=error]Resource group '$(azureResourceGroup)' already exists."
                  Write-Host "##vso[task.logissue type=error]  Delete it manually with 'az group delete -n $(azureResourceGroup) --yes' (if it's from a stuck run), or use a different prefix."
                  exit 1
                } else {
                  Write-Host "Resource group '$(azureResourceGroup)' does not exist - safe to proceed."
                }

      - job: setup
        dependsOn: checkResourceGroup
        displayName: Terraform Setup
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3'

          - task: PowerShell@2
            displayName: Terraform Init
            inputs:
              targetType: 'inline'
              script: 'terraform init -backend=false'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-parallelism=1 -var resource_name_prefix=${{ parameters.resourcePrefix }} -var resource_group_name=$(azureResourceGroup) -var resource_group_location="${{ parameters.azureRegion }}" -var seeder_preset=$(resolvedSeederPreset) -var pool_dtu_override=$(resolvedPoolDtuOverride) -var app_sku_override=$(resolvedAppSkuOverride) -var build_id=$(Build.BuildId) -var="test_cases=$(testCasesJson)"'

      - job: apply
        displayName: Terraform Apply
        dependsOn: setup
        # Apply runs the install script per case sequentially (parallelism=1).
        # Massive preset can take ~120 min per case; budget generously.
        timeoutInMinutes: 720
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3'

          - task: UseDotNet@2
            displayName: 'Install .NET SDK $(resolvedSdkVersion)'
            inputs:
              packageType: sdk
              version: '$(resolvedSdkVersion)'

          - task: PowerShell@2
            displayName: Terraform Init
            inputs:
              targetType: 'inline'
              script: 'terraform init -backend=false'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: AzureCLI@2
            name: AzLoginInfo
            displayName: Get Azure credentials
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              # Under WIF, $idToken is set and $servicePrincipalKey is empty.
              # Under client-secret auth, the opposite. issecret=true masks all.
              # Subscription ID isn't surfaced by addSpnToEnvironment, so read it
              # explicitly — install-umbraco-cms-on-appservice.ps1 pins `az account`
              # to it after `az login` to avoid multi-sub default-routing surprises.
              # Connection ID + OIDC request URI let the install script mint a fresh
              # idToken per case — the job-start $idToken can expire mid-apply (AADSTS700024).
              inlineScript: |
                echo "##vso[task.setvariable variable=ARM_CLIENT_ID;issecret=true]$servicePrincipalId"
                echo "##vso[task.setvariable variable=ARM_TENANT_ID;issecret=true]$tenantId"
                echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$servicePrincipalKey"
                echo "##vso[task.setvariable variable=ARM_OIDC_TOKEN;issecret=true]$idToken"
                echo "##vso[task.setvariable variable=ARM_SERVICE_CONNECTION_ID;issecret=true]$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"
                echo "##vso[task.setvariable variable=ARM_OIDC_REQUEST_URI]$SYSTEM_OIDCREQUESTURI"
                echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$(az account show --query id -o tsv)"
              addSpnToEnvironment: true

          - task: TerraformTaskV4@4
            displayName: Terraform Apply
            # ARM_* env vars inherit into the install script via local-exec child-process
            # inheritance. Kept out of terraform variables (which would suppress local-exec
            # output) and out of the local-exec `environment` block (same reason).
            env:
              ARM_CLIENT_ID:       $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET:   $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID:       $(ARM_TENANT_ID)
              ARM_OIDC_TOKEN:      $(ARM_OIDC_TOKEN)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              # Fresh-token context for the install script (see AzLoginInfo).
              ARM_SERVICE_CONNECTION_ID: $(ARM_SERVICE_CONNECTION_ID)
              ARM_OIDC_REQUEST_URI:      $(ARM_OIDC_REQUEST_URI)
              SYSTEM_ACCESSTOKEN:        $(System.AccessToken)
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-parallelism=1 -var resource_name_prefix=${{ parameters.resourcePrefix }} -var resource_group_name=$(azureResourceGroup) -var resource_group_location="${{ parameters.azureRegion }}" -var seeder_preset=$(resolvedSeederPreset) -var pool_dtu_override=$(resolvedPoolDtuOverride) -var app_sku_override=$(resolvedAppSkuOverride) -var build_id=$(Build.BuildId) -var="test_cases=$(testCasesJson)"'

          - task: PowerShell@2
            name: outputVars
            displayName: Extract Terraform outputs
            inputs:
              targetType: 'inline'
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                # Compact map keyed by testCaseId; downstream jobs read it as one variable.
                $raw     = terraform output -json test_case_outputs
                $compact = ($raw | ConvertFrom-Json | ConvertTo-Json -Compress -Depth 10)
                Write-Host "##vso[task.setvariable variable=testCaseOutputs;isOutput=true]$compact"

                # Aggregate per-case seeder results into a single output variable
                # so the loadTest stage (different agent, no shared filesystem)
                # doesn't need a pipeline-artifact handoff just for one field per
                # case. install-umbraco-cms-on-appservice.ps1 wrote
                # .seeder-results/<testCaseId>.json during local-exec; we
                # gather them all here and emit one compact JSON output var.
                $seederResultsDir = Join-Path "$(System.DefaultWorkingDirectory)" ".seeder-results"
                $seederMap = @{}
                if (Test-Path $seederResultsDir) {
                    foreach ($f in Get-ChildItem -Path $seederResultsDir -Filter '*.json') {
                        try {
                            $seederMap[$f.BaseName] = Get-Content $f.FullName -Raw | ConvertFrom-Json
                        } catch {
                            Write-Warning "Couldn't parse seeder result $($f.FullName): $($_.Exception.Message)"
                        }
                    }
                }
                $seederJson = ($seederMap | ConvertTo-Json -Compress -Depth 5)
                Write-Host "Aggregated $($seederMap.Count) seeder result(s)"
                Write-Host "##vso[task.setvariable variable=seederResults;isOutput=true]$seederJson"
