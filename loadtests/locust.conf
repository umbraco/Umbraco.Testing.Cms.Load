# Locust configuration shipped to ALT engines (and usable locally).
#
# Local dev:
#   cd loadtests && locust -f scenarios/Default/locustfile.py --host https://<app-service-url>
#   (swap Default for DeliveryApi to run that scenario)
#
# On Azure Load Testing, the testPlan path is set in the generated config
# YAML and points at the scenario-specific locustfile; ALT flattens everything
# into one engine working dir so locustfile.py + _helpers.py + this conf all
# resolve relative to each other at runtime.
