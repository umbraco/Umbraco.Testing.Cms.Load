name: load_test_pipeline

trigger: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
  # One entry per (version, scenario); validation expands tiers[] into N cases. See README.
  - name: testCases
    displayName: Test cases
    type: object
    default:
      - { umbraco: '17.0.0', dotnet: 'v10.0', scenario: 'Default', tiers: ['Starter', 'Standard', 'Pro'] }

  - name: azureRegion
    displayName: Azure region
    type: string
    default: West Europe
    values:
      - West Europe
      - North Europe
      - East US
      - West US 2

  # Feeds into RG name + resource names. Concurrent runs with the same prefix collide.
  - name: prefix
    displayName: Prefix for all resources (max 16 chars, lowercase alphanumeric + hyphens; must be unique per concurrent run)
    type: string
    default: umbraco-loadtest

  - name: userAmount
    displayName: Virtual users (default - scenarios may override)
    type: number
    default: 100
    values:
      - 50
      - 100
      - 150
      - 200
      - 250
      - 300

  - name: spawnRate
    displayName: Spawn rate (users/second during ramp-up)
    type: number
    default: 10
    values:
      - 5
      - 10
      - 20
      - 50

  - name: testDuration
    displayName: Test duration (seconds, steady-state)
    type: number
    default: 300
    values:
      - 60
      - 120
      - 180
      - 300
      - 600

  - name: engineInstances
    displayName: ALT engine instances
    type: number
    default: 1
    values:
      - 1
      - 2
      - 4

  - name: coldStart
    displayName: Cold start test (skip warmup)
    type: boolean
    default: false

  - name: skipLoadTests
    displayName: Skip load tests (infra-only run)
    type: boolean
    default: false

  - name: seederPreset
    displayName: Data seeder preset
    type: string
    default: Medium
    values:
      - Small
      - Medium
      - Large
      - Massive

  - name: validationTimeoutMinutes
    displayName: Manual validation timeout (minutes) - how long resources stay alive after tests
    type: number
    default: 60
    values:
      - 15
      - 30
      - 60
      - 120
      - 240

variables:
  # Variable group `umbraco-loadtest-history` provides all history* variables:
  # historyResourceGroup, historyLocation, historyLoadTestName,
  # historyStorageAccount, historyContainer.
  - group: umbraco-loadtest-history

  - name: serviceConnection
    value: 'terraform-umbraco-load-testing-az-connection'
  - name: azureResourceGroup
    value: '${{ parameters.prefix }}-rg'
  - name: terraformWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/Terraform'

stages:
  - stage: validateTestCases
    displayName: Validate test cases
    jobs:
      - job: prepareTestCases
        displayName: Validate + resolve test cases
        steps:
          - task: PowerShell@2
            name: out
            displayName: Run prepare-test-cases.ps1
            env:
              # Pass via env var; convertToJson() emits chars unsafe for arg quoting.
              TEST_CASES_JSON: ${{ convertToJson(parameters.testCases) }}
            inputs:
              targetType: 'filePath'
              filePath: '$(System.DefaultWorkingDirectory)/scripts/prepare-test-cases.ps1'
              arguments: >
                -UserAmount ${{ parameters.userAmount }}
                -SpawnRate ${{ parameters.spawnRate }}
                -TestDuration ${{ parameters.testDuration }}
                -WorkspaceRoot "$(System.DefaultWorkingDirectory)"

  - stage: ensureHistoryInfra
    displayName: Ensure history infrastructure
    dependsOn: validateTestCases
    jobs:
      - job: ensure
        displayName: Ensure history RG, ALT, storage
        steps:
          - task: AzureCLI@2
            displayName: Ensure history infra
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'scriptPath'
              scriptPath: '$(System.DefaultWorkingDirectory)/scripts/ensure-history-infra.ps1'
              arguments: >
                -HistoryResourceGroup "$(historyResourceGroup)"
                -HistoryLocation "$(historyLocation)"
                -LoadTestName "$(historyLoadTestName)"
                -StorageAccountName "$(historyStorageAccount)"
                -ContainerName "$(historyContainer)"

  - stage: terraformDeploy
    displayName: Terraform Setup and Apply
    dependsOn:
      - validateTestCases
      - ensureHistoryInfra
    # Cross-stage outputs from the validation stage, scoped to the whole stage.
    variables:
      testCasesJson:     $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.testCasesJson'] ]
      resolvedTestCases: $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedTestCases'] ]
    jobs:
      - job: checkResourceGroup
        displayName: Check if resource group exists
        steps:
          - task: AzureCLI@2
            displayName: Fail if resource group already exists
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Fail if the RG already exists - either a stuck previous run or a prefix collision.
                $exists = az group exists -n $(azureResourceGroup)
                if ($exists -eq 'true') {
                  Write-Host "##vso[task.logissue type=error]Resource group '$(azureResourceGroup)' already exists."
                  Write-Host "##vso[task.logissue type=error]  Delete it manually (az group delete -n $(azureResourceGroup) --yes) or use a different prefix."
                  exit 1
                }
                Write-Host "Resource group '$(azureResourceGroup)' does not exist - safe to proceed."

      - job: setup
        dependsOn: checkResourceGroup
        displayName: Terraform Setup
        steps:
          - task: TerraformInstaller@0
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3'

          - task: PowerShell@2
            displayName: Terraform Init
            inputs:
              targetType: 'inline'
              script: 'terraform init -backend=false'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-parallelism=1 -var resource_name_prefix=${{ parameters.prefix }} -var resource_group_name=$(azureResourceGroup) -var resource_group_location="${{ parameters.azureRegion }}" -var seeder_preset=${{ parameters.seederPreset }} -var build_id=$(Build.BuildId) -var="test_cases=$(testCasesJson)"'

      - job: apply
        displayName: Terraform Apply
        dependsOn: setup
        # Apply runs the install script per case sequentially (parallelism=1).
        # Massive preset can take ~120 min per case; budget generously.
        timeoutInMinutes: 720
        steps:
          - task: TerraformInstaller@0
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3'

          - task: PowerShell@2
            displayName: Terraform Init
            inputs:
              targetType: 'inline'
              script: 'terraform init -backend=false'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: AzureCLI@2
            name: AzLoginInfo
            displayName: Get Azure credentials
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              # Under WIF, $idToken is set and $servicePrincipalKey is empty.
              # Under client-secret auth, the opposite. issecret=true masks all.
              inlineScript: |
                echo "##vso[task.setvariable variable=ARM_CLIENT_ID;issecret=true]$servicePrincipalId"
                echo "##vso[task.setvariable variable=ARM_TENANT_ID;issecret=true]$tenantId"
                echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$servicePrincipalKey"
                echo "##vso[task.setvariable variable=ARM_OIDC_TOKEN;issecret=true]$idToken"
              addSpnToEnvironment: true

          - task: TerraformTaskV4@4
            displayName: Terraform Apply
            # SP credentials flow via TF_VAR_* env vars (not -var=) so they don't appear
            # in the commandOptions string AzDO logs at task start.
            # Both client_secret and oidc_token are passed; the install script picks
            # whichever is non-empty (secret for client-secret auth, token for WIF).
            env:
              TF_VAR_client_id:        $(ARM_CLIENT_ID)
              TF_VAR_client_secret:    $(ARM_CLIENT_SECRET)
              TF_VAR_tenant_id:        $(ARM_TENANT_ID)
              TF_VAR_client_oidc_token: $(ARM_OIDC_TOKEN)
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-parallelism=1 -var resource_name_prefix=${{ parameters.prefix }} -var resource_group_name=$(azureResourceGroup) -var resource_group_location="${{ parameters.azureRegion }}" -var seeder_preset=${{ parameters.seederPreset }} -var build_id=$(Build.BuildId) -var="test_cases=$(testCasesJson)"'

          - task: PowerShell@2
            name: outputVars
            displayName: Extract Terraform outputs
            inputs:
              targetType: 'inline'
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                # Compact map keyed by testCaseId; downstream jobs read it as one variable.
                $raw     = terraform output -json test_case_outputs
                $compact = ($raw | ConvertFrom-Json | ConvertTo-Json -Compress -Depth 10)
                Write-Host "##vso[task.setvariable variable=testCaseOutputs;isOutput=true]$compact"

          # Clean state files; mainly relevant on self-hosted agents where the VM persists.
          - task: PowerShell@2
            displayName: Clean up local terraform state
            condition: always()
            inputs:
              targetType: 'inline'
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                Remove-Item .terraform terraform.tfstate* -Recurse -Force -ErrorAction SilentlyContinue

      # Smoke check, only when skipLoadTests=true. Load tests do their own warm-up.
      - job: verifyDeployments
        displayName: Smoke-verify deployed sites
        dependsOn: apply
        condition: and(succeeded(), eq('${{ parameters.skipLoadTests }}', 'True'))
        variables:
          testCaseOutputs: $[ dependencies.apply.outputs['outputVars.testCaseOutputs'] ]
        steps:
          - task: AzureCLI@2
            displayName: Start, hit /, stop each App Service
            env:
              TEST_CASE_OUTPUTS: $(testCaseOutputs)
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'scriptPath'
              scriptPath: '$(System.DefaultWorkingDirectory)/scripts/verify-deployments.ps1'
              arguments: >
                -ResourceGroupName "$(azureResourceGroup)"

      - job: runLoadTests
        displayName: Run Load Tests
        dependsOn: apply
        condition: and(succeeded(), eq('${{ parameters.skipLoadTests }}', 'False'))
        # Each case: warm-up (~5 min) + ALT test (configurable up to 600s) + publish.
        # Sequential per-case execution; budget for a 21-case full matrix.
        timeoutInMinutes: 720
        variables:
          testCaseOutputs: $[ dependencies.apply.outputs['outputVars.testCaseOutputs'] ]
        steps:
          # Compile-time expansion: one template invocation per (case x tier).
          # Keep testCaseId format in sync with the runtime construction in prepare-test-cases.ps1.
          - ${{ each case in parameters.testCases }}:
            - ${{ each tier in case.tiers }}:
              - template: templates/load-test-job.yml
                parameters:
                  serviceConnection: '$(serviceConnection)'
                  resourceGroupName: '$(azureResourceGroup)'
                  testCaseId: '${{ case.umbraco }}__${{ tier }}__${{ case.scenario }}'
                  tier: '${{ tier }}'
                  scenario: '${{ case.scenario }}'
                  umbracoVersion: '${{ case.umbraco }}'
                  dotnetVersion: '${{ case.dotnet }}'
                  engineInstances: ${{ parameters.engineInstances }}
                  coldStart: ${{ parameters.coldStart }}
                  historyResourceGroup: '$(historyResourceGroup)'
                  historyLoadTestName: '$(historyLoadTestName)'
                  historyStorageAccount: '$(historyStorageAccount)'
                  historyContainer: '$(historyContainer)'
                  seederPreset: '${{ parameters.seederPreset }}'

          # Stop all apps so none run idle during the manual validation window.
          - task: AzureCLI@2
            displayName: 'Stop all App Services'
            condition: succeededOrFailed()
            env:
              TEST_CASE_OUTPUTS: $(testCaseOutputs)
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'scriptPath'
              scriptPath: '$(System.DefaultWorkingDirectory)/scripts/stop-all-app-services.ps1'
              arguments: >
                -ResourceGroupName "$(azureResourceGroup)"

      - job: testSummary
        dependsOn:
          - apply
          - verifyDeployments
          - runLoadTests
        condition: succeededOrFailed()
        displayName: Test Summary
        steps:
          - task: PowerShell@2
            displayName: Print summary
            env:
              RESOLVED_TEST_CASES: $(resolvedTestCases)
              SKIP_LOAD_TESTS: ${{ parameters.skipLoadTests }}
            inputs:
              targetType: 'inline'
              script: |
                Write-Host ""
                Write-Host "=============================================="
                Write-Host "       LOAD TEST SUMMARY"
                Write-Host "=============================================="
                Write-Host ""
                Write-Host "Run-level configuration:"
                Write-Host "  Region:         ${{ parameters.azureRegion }}"
                Write-Host "  Default users:  ${{ parameters.userAmount }}"
                Write-Host "  Spawn rate:     ${{ parameters.spawnRate }} users/sec"
                Write-Host "  Default duration: ${{ parameters.testDuration }}s"
                Write-Host "  Cold start:     ${{ parameters.coldStart }}"
                Write-Host "  Seeder preset:  ${{ parameters.seederPreset }}"
                Write-Host ""
                Write-Host "Test cases:"
                $cases = $env:RESOLVED_TEST_CASES | ConvertFrom-Json
                foreach ($prop in $cases.PSObject.Properties) {
                  Write-Host "  - $($prop.Value.label)"
                }
                Write-Host ""
                if ($env:SKIP_LOAD_TESTS -eq 'True') {
                  Write-Host "Load tests SKIPPED (skipLoadTests=true) - see verifyDeployments job for smoke results."
                } else {
                  Write-Host "Results available in:"
                  Write-Host "  - Azure Load Testing portal"
                  Write-Host "  - Pipeline artifacts (loadtest-results-*)"
                  Write-Host "  - History storage NDJSON (rows tagged with infra_tier + scenario)"
                }
                Write-Host "=============================================="

      - job: checkResourceGroupForCleanup
        dependsOn:
          - verifyDeployments
          - runLoadTests
          - testSummary
        condition: succeededOrFailed()
        displayName: Check resource group for cleanup
        steps:
          - task: AzureCLI@2
            name: checkResourceGroup
            displayName: Check if resource group exists
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $exists = az group exists -n $(azureResourceGroup)
                Write-Host "##vso[task.setvariable variable=doesExist;isOutput=true]$exists"

      - job: manualValidation
        dependsOn: checkResourceGroupForCleanup
        condition: eq(dependencies.checkResourceGroupForCleanup.outputs['checkResourceGroup.doesExist'], 'true')
        displayName: Manual validation - keep resources?
        pool: server
        timeoutInMinutes: ${{ parameters.validationTimeoutMinutes }}
        steps:
          - task: ManualValidation@0
            displayName: Approve to keep resources
            timeoutInMinutes: ${{ parameters.validationTimeoutMinutes }}
            inputs:
              instructions: |
                Press "Resume" to KEEP the resource group $(azureResourceGroup).
                Press "Reject" (or wait ${{ parameters.validationTimeoutMinutes }} minutes) to DELETE all resources.

      # User pressed Reject, the validation timed out, or the chain skipped: delete the RG.
      - job: deleteResourceGroup
        displayName: Delete resource group
        dependsOn: manualValidation
        condition: in(dependencies.manualValidation.result, 'Failed', 'Canceled', 'Skipped')
        steps:
          - task: AzureCLI@2
            displayName: Delete resource group
            retryCountOnTaskFailure: 5
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $exists = az group exists -n $(azureResourceGroup)
                if ($exists -eq 'true') {
                  Write-Host "Deleting resource group $(azureResourceGroup)..."
                  az group delete -n $(azureResourceGroup) --yes
                } else {
                  Write-Host "Resource group $(azureResourceGroup) does not exist, skipping deletion."
                }
