name: load_test_pipeline

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: umbracoVersion
    displayName: Umbraco version (e.g. 17.0.0, 17.0.1-rc.1, 17.1.0-beta.2)
    type: string
    default: '17.0.0'

  - name: scenario
    displayName: Scenario (must match a folder under loadtests/scenarios/)
    type: string
    default: 'Default'
    values:
      - 'Default'
      - 'DeliveryApi'

  # Workload selects what kind of traffic the load test generates against the
  # provisioned Umbraco. 'frontend' runs the scenario's locustfile.py (the
  # default path, unchanged from prior versions). 'backoffice' runs the JMeter
  # tests under loadtests/scenarios/<scenario>/jmeter/v<major>/. v17 JMeter
  # files are used for v18 deployments (matches the seeder fallback).
  # resolve-run-config validates that the chosen (scenario, workload) pair has
  # the required files — e.g. workload=backoffice on a scenario without a
  # jmeter/ folder fails fast at queue-time, not 15 minutes into provisioning.
  - name: workload
    displayName: Workload (frontend = Locust, backoffice = JMeter)
    type: string
    default: 'frontend'
    values:
      - 'frontend'
      - 'backoffice'

  # Backoffice only: which JMeter plans to run this run. Delete entries at queue
  # time to skip plans — e.g. drop SaveDocumentType (known v18 lock wedge) to keep
  # a run readable, or keep only the write plans. Ignored for the frontend
  # workload. A plan with no .jmx for the resolved major is skipped anyway.
  - name: backofficePlans
    displayName: 'Backoffice plans (remove to skip; backoffice workload only)'
    type: object
    default:
      - ViewHomePage
      - MemberLogin
      - SaveContent
      - SaveAndPublishContent
      - SaveDocumentType
      - PublishContent

  - name: runStarter
    displayName: Run Starter tier
    type: boolean
    default: true

  - name: runStandard
    displayName: Run Standard tier
    type: boolean
    default: false

  - name: runPro
    displayName: Run Pro tier
    type: boolean
    default: false

  - name: runEnterprise
    displayName: Run Enterprise tier
    type: boolean
    default: false

  - name: loadProfile
    displayName: 'Load profile (intensity) — smoke: 20 VUs / 60s, standard: 50 VUs / 300s, stress: 300 VUs / 600s, ramp: 0→max / 600s. Backoffice uses lower VU counts (heavier per VU).'
    type: string
    default: 'standard'
    values:
      - 'smoke'      # Small,  20 VUs,  60s, 1 engine  -- quick "does it work" probe
      - 'standard'   # Medium, 50 VUs, 300s, 1 engine -- typical comparison run
      - 'stress'     # Medium, 300 VUs, 600s, 2 engines -- saturate the lower tiers
      - 'ramp'       # Medium, 0->300 VUs (backoffice 0->60), 600s, 1 engine -- climb to find the saturation knee

  - name: azureRegion
    displayName: Azure region
    type: string
    default: West Europe
    values:
      - West Europe
      - North Europe
      - East US
      - West US 2

  # Feeds into RG name + resource names. Concurrent runs with the same prefix collide.
  - name: resourcePrefix
    displayName: Resource name prefix (max 16 chars, lowercase alphanumeric + hyphens; must be unique per concurrent run)
    type: string
    default: umbraco-loadtest

  - name: skipWarmup
    displayName: Skip warmup (test cold-start behaviour)
    type: boolean
    default: false

  # Arms the regression gate. Off keeps today's report-only behaviour, but as a
  # visible knob rather than a hardcoded flag. Cells with < MinBaselineRuns never
  # fail either way, so arming it is safe as soon as baselines exist.
  - name: failOnRegression
    displayName: Fail the pipeline on regression (off = report-only; safe to enable once cells have 3+ clean runs)
    type: boolean
    default: false

  - name: validationTimeoutMinutes
    displayName: Manual validation timeout (minutes) - how long resources stay alive after tests
    type: number
    default: 60
    values:
      - 15
      - 30
      - 60
      - 120
      - 240

  # Override the per-DB DTU cap for every case so SQL can be sized independently
  # of the tier's default — useful for "is SQL actually the bottleneck?"
  # experiments. Defaults (per loadtests/tiers.json): Starter=20, Standard=50,
  # Pro=100, Enterprise=200. 'Auto' = use each tier's built-in DTU cap.
  - name: poolDtuOverride
    displayName: SQL per-DB DTU override (Auto = match tier)
    type: string
    default: 'Auto'
    values:
      - 'Auto'
      - '10'
      - '20'
      - '50'
      - '100'
      - '200'

  # Override the App Service Plan SKU for every case so app size is independent
  # of the tier — counterpart to poolDtuOverride on the app side. Defaults
  # (per loadtests/tiers.json): Starter=P0v3, Standard=P1v3, Pro=P2v3,
  # Enterprise=P3v3. 'Auto' = use each tier's built-in SKU.
  - name: appSkuOverride
    displayName: App Service SKU override (Auto = match tier)
    type: string
    default: 'Auto'
    values:
      - 'Auto'
      - 'P0v3'
      - 'P1v3'
      - 'P2v3'
      - 'P3v3'

  # Override the TestDataSeeder preset so content size is independent of the
  # load profile. 'Auto' couples preset to profile (smoke=Small; standard, stress,
  # and ramp=Medium — Large hangs the seeder). Override unlocks the otherwise-
  # unreachable Massive preset
  # and enables off-diagonal cells (Small content + stress load, Massive content
  # + smoke load, etc.). Approximate seeder times: Small ~10 min, Medium ~3 min
  # (re-verified 2026-08-22 at 178.62s post-logging-fix, was ~30 min before the
  # Serilog quieting — Small/Large/Massive not yet re-verified), Large ~60 min,
  # Massive ~120 min.
  - name: seederPresetOverride
    displayName: Seeder preset override (Auto = match load profile)
    type: string
    default: 'Auto'
    values:
      - 'Auto'
      - 'Small'
      - 'Medium'
      - 'Large'
      - 'Massive'

variables:
  # Variable group `umbraco-loadtest-history` provides all history* variables:
  # historyResourceGroup, historyLocation, historyLoadTestName,
  # historyStorageAccount, historyContainer.
  - group: umbraco-loadtest-history

  - name: serviceConnection
    value: 'terraform-umbraco-load-testing-az-connection'
  - name: azureResourceGroup
    value: '${{ parameters.resourcePrefix }}-rg'
  - name: terraformWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/Terraform'

  # Long-lived monitoring resources. Defaults are fine for a single team in a
  # subscription; override in the variable group if multiple teams share one.
  - name: historyWorkspaceName
    value: 'umbraco-loadtest-laws'
  - name: historyDceName
    value: 'umbraco-loadtest-dce'
  - name: historyDcrName
    value: 'umbraco-loadtest-dcr'

stages:
  - template: templates/stages/provision.yml
    parameters:
      umbracoVersion: '${{ parameters.umbracoVersion }}'
      scenario: '${{ parameters.scenario }}'
      workload: '${{ parameters.workload }}'
      loadProfile: '${{ parameters.loadProfile }}'
      resourcePrefix: '${{ parameters.resourcePrefix }}'
      azureRegion: '${{ parameters.azureRegion }}'
      runStarter: ${{ parameters.runStarter }}
      runStandard: ${{ parameters.runStandard }}
      runPro: ${{ parameters.runPro }}
      runEnterprise: ${{ parameters.runEnterprise }}
      poolDtuOverride: '${{ parameters.poolDtuOverride }}'
      appSkuOverride: '${{ parameters.appSkuOverride }}'
      seederPresetOverride: '${{ parameters.seederPresetOverride }}'

  - stage: loadTest
    displayName: Run load tests
    dependsOn:
      - validateTestCases
      - ensureMonitoringInfra
      - provision
    # Only run if provision completed; if provision failed we skip straight to cleanup.
    condition: succeeded('provision')
    variables:
      # Stage-level fan-out: every job in this stage inherits these.
      # Resolved values come from validateTestCases; testCaseOutputs from provision.apply.
      testCaseOutputs:         $[ stageDependencies.provision.apply.outputs['outputVars.testCaseOutputs'] ]
      seederResults:           $[ stageDependencies.provision.apply.outputs['outputVars.seederResults'] ]
      resolvedTestCases:       $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedTestCases'] ]
      resolvedDotnetVersion:   $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedDotnetVersion'] ]
      resolvedSeederPreset:    $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedSeederPreset'] ]
      resolvedEngineInstances: $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedEngineInstances'] ]
      resolvedWorkload:        $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedWorkload'] ]
      monitoringDceUri:           $[ stageDependencies.ensureMonitoringInfra.ensure.outputs['ensureMon.MonitoringDceUri'] ]
      monitoringDcrImmutableId:   $[ stageDependencies.ensureMonitoringInfra.ensure.outputs['ensureMon.MonitoringDcrImmutableId'] ]
      monitoringStreamName:       $[ stageDependencies.ensureMonitoringInfra.ensure.outputs['ensureMon.MonitoringStreamName'] ]
      monitoringSeriesStreamName: $[ stageDependencies.ensureMonitoringInfra.ensure.outputs['ensureMon.MonitoringSeriesStreamName'] ]
    jobs:
      - job: runLoadTests
        displayName: Run Load Tests
        # Each case: warm-up (~5 min) + load test (up to 600s) + publish. Up to four
        # cases per queue (one per selected tier); budget generously.
        timeoutInMinutes: 720
        steps:
          # Tier expansion driven by the runStarter/runStandard/runPro checkboxes.
          # Profile is independent and only sets load intensity (resolved via the
          # runtime variables resolvedSeederPreset / resolvedEngineInstances etc.).
          # Keep testCaseId format in sync with the runtime construction in
          # prepare-test-cases.ps1.
          - ${{ if eq(parameters.runStarter, true) }}:
            - template: templates/load-test-job.yml
              parameters:
                testCaseId: '${{ parameters.umbracoVersion }}__Starter__${{ parameters.scenario }}'
                tier: 'Starter'
                scenario: '${{ parameters.scenario }}'
                umbracoVersion: '${{ parameters.umbracoVersion }}'
                workload: '${{ parameters.workload }}'
                jmxNames: ${{ parameters.backofficePlans }}
                skipWarmup: ${{ parameters.skipWarmup }}
                logAnalyticsDceUri: $(monitoringDceUri)
                logAnalyticsDcrImmutableId: $(monitoringDcrImmutableId)
                logAnalyticsStreamName: $(monitoringStreamName)
                logAnalyticsSeriesStreamName: $(monitoringSeriesStreamName)
          - ${{ if eq(parameters.runStandard, true) }}:
            - template: templates/load-test-job.yml
              parameters:
                testCaseId: '${{ parameters.umbracoVersion }}__Standard__${{ parameters.scenario }}'
                tier: 'Standard'
                scenario: '${{ parameters.scenario }}'
                umbracoVersion: '${{ parameters.umbracoVersion }}'
                workload: '${{ parameters.workload }}'
                jmxNames: ${{ parameters.backofficePlans }}
                skipWarmup: ${{ parameters.skipWarmup }}
                logAnalyticsDceUri: $(monitoringDceUri)
                logAnalyticsDcrImmutableId: $(monitoringDcrImmutableId)
                logAnalyticsStreamName: $(monitoringStreamName)
                logAnalyticsSeriesStreamName: $(monitoringSeriesStreamName)
          - ${{ if eq(parameters.runPro, true) }}:
            - template: templates/load-test-job.yml
              parameters:
                testCaseId: '${{ parameters.umbracoVersion }}__Pro__${{ parameters.scenario }}'
                tier: 'Pro'
                scenario: '${{ parameters.scenario }}'
                umbracoVersion: '${{ parameters.umbracoVersion }}'
                workload: '${{ parameters.workload }}'
                jmxNames: ${{ parameters.backofficePlans }}
                skipWarmup: ${{ parameters.skipWarmup }}
                logAnalyticsDceUri: $(monitoringDceUri)
                logAnalyticsDcrImmutableId: $(monitoringDcrImmutableId)
                logAnalyticsStreamName: $(monitoringStreamName)
                logAnalyticsSeriesStreamName: $(monitoringSeriesStreamName)
          - ${{ if eq(parameters.runEnterprise, true) }}:
            - template: templates/load-test-job.yml
              parameters:
                testCaseId: '${{ parameters.umbracoVersion }}__Enterprise__${{ parameters.scenario }}'
                tier: 'Enterprise'
                scenario: '${{ parameters.scenario }}'
                umbracoVersion: '${{ parameters.umbracoVersion }}'
                workload: '${{ parameters.workload }}'
                jmxNames: ${{ parameters.backofficePlans }}
                skipWarmup: ${{ parameters.skipWarmup }}
                logAnalyticsDceUri: $(monitoringDceUri)
                logAnalyticsDcrImmutableId: $(monitoringDcrImmutableId)
                logAnalyticsStreamName: $(monitoringStreamName)
                logAnalyticsSeriesStreamName: $(monitoringSeriesStreamName)

          # Stop all apps so none run idle during the manual validation window.
          # always() (not succeededOrFailed) so a cancelled run also stops the
          # apps — otherwise they bill idle until the cleanup stage deletes the RG.
          - task: AzureCLI@2
            displayName: 'Stop all App Services'
            condition: always()
            env:
              TEST_CASE_OUTPUTS: $(testCaseOutputs)
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'scriptPath'
              scriptPath: '$(System.DefaultWorkingDirectory)/scripts/stop-all-app-services.ps1'
              arguments: >
                -ResourceGroupName "$(azureResourceGroup)"

  # Compare the just-published run against the baseline-median in history
  # storage. Fails the pipeline only when a cell exceeds a threshold AND has
  # >= 3 prior runs to compare against — early in a scenario's life, every
  # cell reports "insufficient baseline" and the script exits 0. Once
  # baselines accrue per (version, tier, sampler), this becomes a real gate.
  - stage: regression
    displayName: Regression check
    dependsOn:
      - ensureMonitoringInfra
      - loadTest
    condition: succeeded('loadTest')
    variables:
      monitoringDceUri:         $[ stageDependencies.ensureMonitoringInfra.ensure.outputs['ensureMon.MonitoringDceUri'] ]
      monitoringDcrImmutableId: $[ stageDependencies.ensureMonitoringInfra.ensure.outputs['ensureMon.MonitoringDcrImmutableId'] ]
      monitoringStreamName:     $[ stageDependencies.ensureMonitoringInfra.ensure.outputs['ensureMon.MonitoringStreamName'] ]
    jobs:
      - job: regressionCheck
        displayName: Regression check
        steps:
          - task: AzureCLI@2
            displayName: Compare run against baseline
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                . "$(System.DefaultWorkingDirectory)/scripts/_helpers.ps1"
                $major = Get-UmbracoMajor '${{ parameters.umbracoVersion }}'

                # Defaults off because the scenario_name discriminator fix reset
                # baseline keys, so windows still mix pre-fix runs. Tick the box
                # once each cell has >=3 clean post-fix runs.
                $splat = @{
                    Scenario                   = '${{ parameters.scenario }}'
                    Major                      = $major
                    # Pin the candidate to THIS run; unpinned it grades whatever
                    # row is newest, which differs if this publish failed.
                    RunId                      = '$(Build.BuildId)'
                    HistoryResourceGroup       = '$(historyResourceGroup)'
                    StorageAccountName         = '$(historyStorageAccount)'
                    ContainerName              = '$(historyContainer)'
                    OutputPath                 = "$(System.DefaultWorkingDirectory)/regression-report.md"
                    LogAnalyticsDceUri         = '$(monitoringDceUri)'
                    LogAnalyticsDcrImmutableId = '$(monitoringDcrImmutableId)'
                    LogAnalyticsStreamName     = '$(monitoringStreamName)'
                }
                $failOnRegression = [System.Convert]::ToBoolean('${{ parameters.failOnRegression }}')
                if (-not $failOnRegression) { $splat.NoFailOnRegression = $true }
                # Plain variable, not a $(...) subexpression: AzDO rewrites $()
                # macros in this YAML before PowerShell sees it.
                $gateMode = if ($failOnRegression) { 'ENFORCING (fails the pipeline)' } else { 'report-only' }
                Write-Host "Regression gate mode: $gateMode"

                & "$(System.DefaultWorkingDirectory)/scripts/check-regression.ps1" @splat
          - task: PublishBuildArtifacts@1
            displayName: Publish regression report
            condition: succeededOrFailed()
            continueOnError: true
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/regression-report.md'
              ArtifactName: 'regression-report'
              publishLocation: 'Container'

  - template: templates/stages/cleanup.yml
    parameters:
      validationTimeoutMinutes: ${{ parameters.validationTimeoutMinutes }}
      dependsOn: [provision, loadTest, regression]
