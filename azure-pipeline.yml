name: load_test_pipeline

trigger: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
  # === What to test ===

  # Free-text input so prereleases (17.0.0-rc.1, 17.0.0-beta.2 etc.) work without
  # editing the YAML each time. The validator enforces v17+ and a recognisable
  # X.Y.Z[-suffix] shape; downstream the major segment maps to the .NET runtime.
  - name: umbracoVersion
    displayName: Umbraco version (e.g. 17.0.0, 17.0.1-rc.1, 17.1.0-beta.2)
    type: string
    default: '17.0.0'

  - name: scenario
    displayName: Scenario (must match a folder under loadtests/scenarios/)
    type: string
    default: 'Default'
    values:
      - 'Default'
      - 'DeliveryApi'

  - name: runStarter
    displayName: Run Starter tier
    type: boolean
    default: true

  - name: runStandard
    displayName: Run Standard tier
    type: boolean
    default: false

  - name: runPro
    displayName: Run Pro tier
    type: boolean
    default: false

  # === How hard to test ===

  # Encodes load intensity only (preset, VUs, spawn rate, duration, engines).
  # Tier selection is independent — the runStarter/runStandard/runPro checkboxes
  # above pick which tiers each profile gets exercised against.
  - name: loadProfile
    displayName: Load profile (intensity)
    type: string
    default: 'standard'
    values:
      - 'smoke'      # Small,  50 VUs,  60s, 1 engine  -- quick "does it work" probe
      - 'standard'   # Medium, 100 VUs, 300s, 1 engine -- typical comparison run
      - 'stress'     # Large,  300 VUs, 600s, 2 engines -- saturate the lower tiers

  # === Run configuration ===

  - name: azureRegion
    displayName: Azure region
    type: string
    default: West Europe
    values:
      - West Europe
      - North Europe
      - East US
      - West US 2

  # Feeds into RG name + resource names. Concurrent runs with the same prefix collide.
  - name: resourcePrefix
    displayName: Resource name prefix (max 16 chars, lowercase alphanumeric + hyphens; must be unique per concurrent run)
    type: string
    default: umbraco-loadtest

  - name: skipWarmup
    displayName: Skip warmup (test cold-start behaviour)
    type: boolean
    default: false

  - name: skipLoadTests
    displayName: Skip load tests (infra-only run)
    type: boolean
    default: false

  - name: validationTimeoutMinutes
    displayName: Manual validation timeout (minutes) - how long resources stay alive after tests
    type: number
    default: 60
    values:
      - 15
      - 30
      - 60
      - 120
      - 240

  # Override the SQL SKU on every case so the database can be sized independently
  # of the tier's nominal pairing — useful for "is SQL actually the bottleneck?"
  # experiments. Defaults today (per loadtests/tiers.json): Starter→S1, Standard→S2,
  # Pro→S3, since the App Service SKU is identical across tiers (mirrors Cloud).
  # 'Auto' = use each tier's built-in pairing.
  - name: sqlSkuOverride
    displayName: SQL SKU override (Auto = use the tier's default pairing)
    type: string
    default: 'Auto'
    values:
      - 'Auto'
      - 'S0'
      - 'S1'
      - 'S2'
      - 'S3'

variables:
  # Variable group `umbraco-loadtest-history` provides all history* variables:
  # historyResourceGroup, historyLocation, historyLoadTestName,
  # historyStorageAccount, historyContainer.
  - group: umbraco-loadtest-history

  - name: serviceConnection
    value: 'terraform-umbraco-load-testing-az-connection'
  - name: azureResourceGroup
    value: '${{ parameters.resourcePrefix }}-rg'
  - name: terraformWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/Terraform'

stages:
  - stage: validateTestCases
    displayName: Validate test cases
    jobs:
      - job: prepareTestCases
        displayName: Validate + resolve test cases
        steps:
          - task: PowerShell@2
            name: out
            displayName: Resolve profile + validate scenario
            env:
              PROFILE: ${{ parameters.loadProfile }}
              UMBRACO_VERSION: ${{ parameters.umbracoVersion }}
              SCENARIO: ${{ parameters.scenario }}
              RUN_STARTER: ${{ parameters.runStarter }}
              RUN_STANDARD: ${{ parameters.runStandard }}
              RUN_PRO: ${{ parameters.runPro }}
              SQL_SKU_OVERRIDE: ${{ parameters.sqlSkuOverride }}
            inputs:
              targetType: 'inline'
              script: |
                # Build the tier list from the three checkboxes. Profile is independent
                # and only encodes load intensity (preset/users/spawn/duration/engines),
                # so the same profile can drive any combination of tiers.
                $tiers = @()
                if ($env:RUN_STARTER  -eq 'True') { $tiers += 'Starter' }
                if ($env:RUN_STANDARD -eq 'True') { $tiers += 'Standard' }
                if ($env:RUN_PRO      -eq 'True') { $tiers += 'Pro' }
                if ($tiers.Count -eq 0) {
                    Write-Error "At least one tier must be selected (runStarter / runStandard / runPro)."
                    exit 1
                }

                # Map the load profile to a (preset, users, spawn, duration, engines) tuple.
                switch ($env:PROFILE) {
                    'smoke'    { $preset = 'Small';  $users = 50;  $spawn = 10; $duration = 60;  $engines = 1 }
                    'standard' { $preset = 'Medium'; $users = 100; $spawn = 10; $duration = 300; $engines = 1 }
                    'stress'   { $preset = 'Large';  $users = 300; $spawn = 50; $duration = 600; $engines = 2 }
                    default {
                        Write-Error "Unknown profile '$env:PROFILE'. Valid: smoke, standard, stress."
                        exit 1
                    }
                }

                # Derive the .NET runtime from the Umbraco major version. Keeps the queue
                # UX simpler (you don't pick .NET separately when it's a function of the
                # CMS version anyway). The validator already rejects v17- runs, so only
                # v17+ branches are reachable here. Extend the table when a future Umbraco
                # version bumps the target framework.
                $umbracoMajorRaw = ($env:UMBRACO_VERSION -split '\.')[0]
                $umbracoMajor = 0
                if (-not [int]::TryParse($umbracoMajorRaw, [ref]$umbracoMajor)) {
                    Write-Error "Cannot parse Umbraco major from '$env:UMBRACO_VERSION' (expected X.Y.Z[-suffix])."
                    exit 1
                }
                $dotnetVersion = switch ($umbracoMajor) {
                    { $_ -ge 17 } { 'v10.0' }
                    default {
                        Write-Error "Umbraco $env:UMBRACO_VERSION is unsupported (this pipeline targets v17+)."
                        exit 1
                    }
                }

                # 'Auto' is the queue-time signal for "use the tier's built-in SQL pairing".
                # Terraform expects an empty string for that case.
                $sqlSkuOverride = if ($env:SQL_SKU_OVERRIDE -eq 'Auto') { '' } else { $env:SQL_SKU_OVERRIDE }

                Write-Host "Tiers:           $($tiers -join ', ')"
                Write-Host "Profile '$env:PROFILE': preset=$preset users=$users spawn=$spawn duration=${duration}s engines=$engines"
                Write-Host "Umbraco $env:UMBRACO_VERSION (major $umbracoMajor) -> .NET $dotnetVersion"
                Write-Host "SQL SKU override: $(if ($sqlSkuOverride) { $sqlSkuOverride } else { 'Auto (per-tier defaults)' })"

                $testCases = @(@{
                    umbraco  = $env:UMBRACO_VERSION
                    dotnet   = $dotnetVersion
                    scenario = $env:SCENARIO
                    tiers    = $tiers
                })
                $env:TEST_CASES_JSON = ($testCases | ConvertTo-Json -Compress -Depth 5)

                # Surface profile-derived config to downstream stages via output vars.
                Write-Host "##vso[task.setvariable variable=resolvedDotnetVersion;isOutput=true]$dotnetVersion"
                Write-Host "##vso[task.setvariable variable=resolvedSeederPreset;isOutput=true]$preset"
                Write-Host "##vso[task.setvariable variable=resolvedEngineInstances;isOutput=true]$engines"
                Write-Host "##vso[task.setvariable variable=resolvedUserAmount;isOutput=true]$users"
                Write-Host "##vso[task.setvariable variable=resolvedSpawnRate;isOutput=true]$spawn"
                Write-Host "##vso[task.setvariable variable=resolvedTestDuration;isOutput=true]$duration"
                Write-Host "##vso[task.setvariable variable=resolvedSqlSkuOverride;isOutput=true]$sqlSkuOverride"

                & "$(System.DefaultWorkingDirectory)/scripts/prepare-test-cases.ps1" `
                    -UserAmount $users `
                    -SpawnRate $spawn `
                    -TestDuration $duration `
                    -WorkspaceRoot "$(System.DefaultWorkingDirectory)"

  - stage: ensureHistoryInfra
    displayName: Ensure history infrastructure
    dependsOn: validateTestCases
    jobs:
      - job: ensure
        displayName: Ensure history RG, Azure Load Testing, storage
        steps:
          - task: AzureCLI@2
            displayName: Ensure history infra
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'scriptPath'
              scriptPath: '$(System.DefaultWorkingDirectory)/scripts/ensure-history-infra.ps1'
              arguments: >
                -HistoryResourceGroup "$(historyResourceGroup)"
                -HistoryLocation "$(historyLocation)"
                -LoadTestName "$(historyLoadTestName)"
                -StorageAccountName "$(historyStorageAccount)"
                -ContainerName "$(historyContainer)"

  - stage: terraformDeploy
    displayName: Terraform Setup and Apply
    dependsOn:
      - validateTestCases
      - ensureHistoryInfra
    # Cross-stage outputs from the validation stage, scoped to the whole stage.
    variables:
      testCasesJson:           $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.testCasesJson'] ]
      resolvedTestCases:       $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedTestCases'] ]
      resolvedDotnetVersion:   $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedDotnetVersion'] ]
      resolvedSeederPreset:    $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedSeederPreset'] ]
      resolvedEngineInstances: $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedEngineInstances'] ]
      resolvedUserAmount:      $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedUserAmount'] ]
      resolvedSpawnRate:       $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedSpawnRate'] ]
      resolvedTestDuration:    $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedTestDuration'] ]
      resolvedSqlSkuOverride:  $[ stageDependencies.validateTestCases.prepareTestCases.outputs['out.resolvedSqlSkuOverride'] ]
    jobs:
      - job: checkResourceGroup
        displayName: Check if resource group exists
        steps:
          - task: AzureCLI@2
            displayName: Fail if resource group already exists
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Fail if the RG already exists — either a stuck previous run or a prefix collision.
                # If it's a stuck run you want to discard, delete it directly:
                #   az group delete -n <name> --yes
                # then re-queue this pipeline.
                $exists = az group exists -n $(azureResourceGroup)
                if ($exists -eq 'true') {
                  Write-Host "##vso[task.logissue type=error]Resource group '$(azureResourceGroup)' already exists."
                  Write-Host "##vso[task.logissue type=error]  Delete it manually with 'az group delete -n $(azureResourceGroup) --yes' (if it's from a stuck run), or use a different prefix."
                  exit 1
                } else {
                  Write-Host "Resource group '$(azureResourceGroup)' does not exist - safe to proceed."
                }

      - job: setup
        dependsOn: checkResourceGroup
        displayName: Terraform Setup
        steps:
          - task: TerraformInstaller@0
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3'

          - task: PowerShell@2
            displayName: Terraform Init
            inputs:
              targetType: 'inline'
              script: 'terraform init -backend=false'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-parallelism=1 -var resource_name_prefix=${{ parameters.resourcePrefix }} -var resource_group_name=$(azureResourceGroup) -var resource_group_location="${{ parameters.azureRegion }}" -var seeder_preset=$(resolvedSeederPreset) -var sql_sku_override=$(resolvedSqlSkuOverride) -var build_id=$(Build.BuildId) -var="test_cases=$(testCasesJson)"'

      - job: apply
        displayName: Terraform Apply
        dependsOn: setup
        # Apply runs the install script per case sequentially (parallelism=1).
        # Massive preset can take ~120 min per case; budget generously.
        timeoutInMinutes: 720
        steps:
          - task: TerraformInstaller@0
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3'

          - task: PowerShell@2
            displayName: Terraform Init
            inputs:
              targetType: 'inline'
              script: 'terraform init -backend=false'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: AzureCLI@2
            name: AzLoginInfo
            displayName: Get Azure credentials
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              # Under WIF, $idToken is set and $servicePrincipalKey is empty.
              # Under client-secret auth, the opposite. issecret=true masks all.
              inlineScript: |
                echo "##vso[task.setvariable variable=ARM_CLIENT_ID;issecret=true]$servicePrincipalId"
                echo "##vso[task.setvariable variable=ARM_TENANT_ID;issecret=true]$tenantId"
                echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$servicePrincipalKey"
                echo "##vso[task.setvariable variable=ARM_OIDC_TOKEN;issecret=true]$idToken"
              addSpnToEnvironment: true

          - task: TerraformTaskV4@4
            displayName: Terraform Apply
            # ARM_* env vars inherit into the install script via local-exec child-process
            # inheritance. Kept out of terraform variables (which would suppress local-exec
            # output) and out of the local-exec `environment` block (same reason).
            env:
              ARM_CLIENT_ID:     $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID:     $(ARM_TENANT_ID)
              ARM_OIDC_TOKEN:    $(ARM_OIDC_TOKEN)
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-parallelism=1 -var resource_name_prefix=${{ parameters.resourcePrefix }} -var resource_group_name=$(azureResourceGroup) -var resource_group_location="${{ parameters.azureRegion }}" -var seeder_preset=$(resolvedSeederPreset) -var sql_sku_override=$(resolvedSqlSkuOverride) -var build_id=$(Build.BuildId) -var="test_cases=$(testCasesJson)"'

          - task: PowerShell@2
            name: outputVars
            displayName: Extract Terraform outputs
            inputs:
              targetType: 'inline'
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                # Compact map keyed by testCaseId; downstream jobs read it as one variable.
                $raw     = terraform output -json test_case_outputs
                $compact = ($raw | ConvertFrom-Json | ConvertTo-Json -Compress -Depth 10)
                Write-Host "##vso[task.setvariable variable=testCaseOutputs;isOutput=true]$compact"

          # Clean state files; mainly relevant on self-hosted agents where the VM persists.
          - task: PowerShell@2
            displayName: Clean up local terraform state
            condition: always()
            inputs:
              targetType: 'inline'
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                Remove-Item .terraform, terraform.tfstate* -Recurse -Force -ErrorAction SilentlyContinue

      # Smoke check, only when skipLoadTests=true. Load tests do their own warm-up.
      - job: verifyDeployments
        displayName: Smoke-verify deployed sites
        dependsOn: apply
        condition: and(succeeded(), eq('${{ parameters.skipLoadTests }}', 'True'))
        variables:
          testCaseOutputs: $[ dependencies.apply.outputs['outputVars.testCaseOutputs'] ]
        steps:
          - task: AzureCLI@2
            displayName: Start, hit /, stop each App Service
            env:
              TEST_CASE_OUTPUTS: $(testCaseOutputs)
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'scriptPath'
              scriptPath: '$(System.DefaultWorkingDirectory)/scripts/verify-deployments.ps1'
              arguments: >
                -ResourceGroupName "$(azureResourceGroup)"

      - job: runLoadTests
        displayName: Run Load Tests
        dependsOn: apply
        condition: and(succeeded(), eq('${{ parameters.skipLoadTests }}', 'False'))
        # Each case: warm-up (~5 min) + load test (configurable up to 600s) + publish.
        # Sequential per-case execution; budget for a 21-case full matrix.
        timeoutInMinutes: 720
        variables:
          testCaseOutputs: $[ dependencies.apply.outputs['outputVars.testCaseOutputs'] ]
        steps:
          # Tier expansion driven by the runStarter/runStandard/runPro checkboxes.
          # Profile is independent and only sets load intensity (resolved via the
          # runtime variables resolvedSeederPreset / resolvedEngineInstances etc.).
          # Keep testCaseId format in sync with the runtime construction in
          # prepare-test-cases.ps1.
          - ${{ if eq(parameters.runStarter, true) }}:
            - template: templates/load-test-job.yml
              parameters:
                serviceConnection: '$(serviceConnection)'
                resourceGroupName: '$(azureResourceGroup)'
                testCaseId: '${{ parameters.umbracoVersion }}__Starter__${{ parameters.scenario }}'
                tier: 'Starter'
                scenario: '${{ parameters.scenario }}'
                umbracoVersion: '${{ parameters.umbracoVersion }}'
                skipWarmup: ${{ parameters.skipWarmup }}
                historyResourceGroup: '$(historyResourceGroup)'
                historyLoadTestName: '$(historyLoadTestName)'
                historyStorageAccount: '$(historyStorageAccount)'
                historyContainer: '$(historyContainer)'
          - ${{ if eq(parameters.runStandard, true) }}:
            - template: templates/load-test-job.yml
              parameters:
                serviceConnection: '$(serviceConnection)'
                resourceGroupName: '$(azureResourceGroup)'
                testCaseId: '${{ parameters.umbracoVersion }}__Standard__${{ parameters.scenario }}'
                tier: 'Standard'
                scenario: '${{ parameters.scenario }}'
                umbracoVersion: '${{ parameters.umbracoVersion }}'
                skipWarmup: ${{ parameters.skipWarmup }}
                historyResourceGroup: '$(historyResourceGroup)'
                historyLoadTestName: '$(historyLoadTestName)'
                historyStorageAccount: '$(historyStorageAccount)'
                historyContainer: '$(historyContainer)'
          - ${{ if eq(parameters.runPro, true) }}:
            - template: templates/load-test-job.yml
              parameters:
                serviceConnection: '$(serviceConnection)'
                resourceGroupName: '$(azureResourceGroup)'
                testCaseId: '${{ parameters.umbracoVersion }}__Pro__${{ parameters.scenario }}'
                tier: 'Pro'
                scenario: '${{ parameters.scenario }}'
                umbracoVersion: '${{ parameters.umbracoVersion }}'
                skipWarmup: ${{ parameters.skipWarmup }}
                historyResourceGroup: '$(historyResourceGroup)'
                historyLoadTestName: '$(historyLoadTestName)'
                historyStorageAccount: '$(historyStorageAccount)'
                historyContainer: '$(historyContainer)'

          # Stop all apps so none run idle during the manual validation window.
          - task: AzureCLI@2
            displayName: 'Stop all App Services'
            condition: succeededOrFailed()
            env:
              TEST_CASE_OUTPUTS: $(testCaseOutputs)
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'scriptPath'
              scriptPath: '$(System.DefaultWorkingDirectory)/scripts/stop-all-app-services.ps1'
              arguments: >
                -ResourceGroupName "$(azureResourceGroup)"

      - job: testSummary
        dependsOn:
          - apply
          - verifyDeployments
          - runLoadTests
        # Only print a summary when apply succeeded; nothing useful to summarise on failure.
        condition: succeeded('apply')
        displayName: Test Summary
        steps:
          - task: PowerShell@2
            displayName: Print summary
            env:
              RESOLVED_TEST_CASES: $(resolvedTestCases)
              SKIP_LOAD_TESTS: ${{ parameters.skipLoadTests }}
            inputs:
              targetType: 'inline'
              script: |
                Write-Host ""
                Write-Host "=============================================="
                Write-Host "       LOAD TEST SUMMARY"
                Write-Host "=============================================="
                Write-Host ""
                Write-Host "Run-level configuration:"
                Write-Host "  Profile:        ${{ parameters.loadProfile }}"
                Write-Host "  Region:         ${{ parameters.azureRegion }}"
                Write-Host "  Default users:  $(resolvedUserAmount)"
                Write-Host "  Spawn rate:     $(resolvedSpawnRate) users/sec"
                Write-Host "  Default duration: $(resolvedTestDuration)s"
                Write-Host "  Skip warmup:    ${{ parameters.skipWarmup }}"
                Write-Host "  Seeder preset:  $(resolvedSeederPreset)"
                Write-Host "  Engine instances: $(resolvedEngineInstances)"
                Write-Host "  SQL SKU override: ${{ parameters.sqlSkuOverride }}"
                Write-Host ""
                Write-Host "Test cases:"
                $cases = $env:RESOLVED_TEST_CASES | ConvertFrom-Json
                foreach ($prop in $cases.PSObject.Properties) {
                  Write-Host "  - $($prop.Value.label)"
                }
                Write-Host ""
                if ($env:SKIP_LOAD_TESTS -eq 'True') {
                  Write-Host "Load tests SKIPPED (skipLoadTests=true) - see verifyDeployments job for smoke results."
                } else {
                  Write-Host "Results available in:"
                  Write-Host "  - Azure Load Testing portal"
                  Write-Host "  - Pipeline artifacts (loadtest-results-*)"
                  Write-Host "  - History storage NDJSON (rows tagged with infra_tier + scenario)"
                }
                Write-Host "=============================================="

      # Compare the just-published run against the baseline-median in history
      # storage. Fails the pipeline only when a cell exceeds a threshold AND has
      # >= 3 prior runs to compare against — early in a scenario's life, every
      # cell reports "insufficient baseline" and the script exits 0. Once
      # baselines accrue per (version, tier, sampler), this becomes a real gate.
      - job: regressionCheck
        dependsOn:
          - apply
          - runLoadTests
        condition: and(succeeded('runLoadTests'), eq('${{ parameters.skipLoadTests }}', 'False'))
        displayName: Regression check
        steps:
          - task: AzureCLI@2
            displayName: Compare run against baseline
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $major = ('${{ parameters.umbracoVersion }}' -split '\.')[0]
                & "$(System.DefaultWorkingDirectory)/scripts/check-regression.ps1" `
                    -Scenario '${{ parameters.scenario }}' `
                    -Major $major `
                    -HistoryResourceGroup '$(historyResourceGroup)' `
                    -StorageAccountName '$(historyStorageAccount)' `
                    -ContainerName '$(historyContainer)' `
                    -OutputPath "$(System.DefaultWorkingDirectory)/regression-report.md"
          - task: PublishBuildArtifacts@1
            displayName: Publish regression report
            condition: succeededOrFailed()
            continueOnError: true
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/regression-report.md'
              ArtifactName: 'regression-report'
              publishLocation: 'Container'

      - job: checkResourceGroupForCleanup
        dependsOn:
          - apply
          - verifyDeployments
          - runLoadTests
          - testSummary
          - regressionCheck
        # apply in dependsOn ensures the cleanup chain still fires on apply-failure
        # (apply Failed is a definite state; the others would be Skipped). regressionCheck
        # added to the chain so cleanup waits for the gate to finish; cleanup uses
        # succeededOrFailed() so a regression-fail still triggers RG teardown.
        condition: succeededOrFailed()
        displayName: Check resource group for cleanup
        steps:
          - task: AzureCLI@2
            name: checkResourceGroup
            displayName: Check if resource group exists
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $exists = az group exists -n $(azureResourceGroup)
                Write-Host "##vso[task.setvariable variable=doesExist;isOutput=true]$exists"

      - job: manualValidation
        dependsOn: checkResourceGroupForCleanup
        condition: eq(dependencies.checkResourceGroupForCleanup.outputs['checkResourceGroup.doesExist'], 'true')
        displayName: Manual validation - keep resources?
        pool: server
        timeoutInMinutes: ${{ parameters.validationTimeoutMinutes }}
        steps:
          - task: ManualValidation@0
            displayName: Approve to keep resources
            timeoutInMinutes: ${{ parameters.validationTimeoutMinutes }}
            inputs:
              instructions: |
                Press "Resume" to KEEP the resource group $(azureResourceGroup).
                Press "Reject" (or wait ${{ parameters.validationTimeoutMinutes }} minutes) to DELETE all resources.

      # User pressed Reject, the validation timed out, or the chain skipped: delete the RG.
      - job: deleteResourceGroup
        displayName: Delete resource group
        dependsOn: manualValidation
        condition: in(dependencies.manualValidation.result, 'Failed', 'Canceled', 'Skipped')
        steps:
          - task: AzureCLI@2
            displayName: Delete resource group
            retryCountOnTaskFailure: 5
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $exists = az group exists -n $(azureResourceGroup)
                if ($exists -eq 'true') {
                  Write-Host "Deleting resource group $(azureResourceGroup)..."
                  az group delete -n $(azureResourceGroup) --yes
                } else {
                  Write-Host "Resource group $(azureResourceGroup) does not exist, skipping deletion."
                }
