# Umbraco Load Testing Pipeline
# Provisions Azure infrastructure and runs k6 load tests against Umbraco CMS.

name: load-test-pipeline
trigger: none
pool:
  vmImage: 'ubuntu-latest'

parameters:
  # App Service
  - name: appServicePlanSku
    displayName: App Service Plan SKU
    type: string
    default: S3
    values:
      - S1
      - S2
      - S3

  # SQL Database
  - name: sqlSku
    displayName: SQL Database SKU
    type: string
    default: S0
    values:
      - S0
      - S1
      - S2

  - name: sqlMaxSizeGb
    displayName: SQL Database Max Size (GB)
    type: number
    default: 5
    values:
      - 2
      - 5
      - 10
      - 20

  # Load test configuration
  - name: userAmount
    displayName: Virtual Users
    type: number
    default: 100
    values:
      - 50
      - 100
      - 150
      - 200
      - 250
      - 300

  - name: testDuration
    displayName: Test Duration
    type: string
    default: '3m'
    values:
      - '1m'
      - '2m'
      - '3m'
      - '5m'
      - '10m'

  - name: warmupSeconds
    displayName: Warm-up Wait (seconds)
    type: number
    default: 300
    values:
      - 120
      - 180
      - 300
      - 600

  # Resource naming
  - name: prefix
    displayName: Resource Name Prefix
    type: string
    default: umbraco-azure-load-test-pipeline

variables:
  - group: UmbracoLoadTest
  - name: serviceConnection
    value: 'terraform-umbraco-load-testing-az-serviceconnection'
  - name: azurergname
    value: '${{ parameters.prefix }}-rg'
  - name: loadTestResource
    value: '${{ parameters.prefix }}-loadtest'
  - name: terraformWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/terraform'

stages:
  - stage: terraformDeploy
    displayName: Infrastructure & Load Tests
    jobs:
      - job: checkResourceGroup
        displayName: Check Resource Group
        steps:
          - task: AzureCLI@2
            name: checkGroup
            displayName: Check if resource group exists
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: 'Write-Host "##vso[task.setvariable variable=resourceGroupExists;isOutput=true]$(az group exists -n $(azurergname))"'

      - job: getFormattedVersions
        displayName: Format Versions
        steps:
          # Convert empty versions to null for Terraform
          - script: echo "##vso[task.setvariable variable=firstDotNetVersion]null"
            displayName: Set firstDotNetVersion to null if empty
            condition: eq(variables['firstDotNetVersion'],'')
          - script: echo "##vso[task.setvariable variable=firstUmbracoVersion]null"
            displayName: Set firstUmbracoVersion to null if empty
            condition: eq(variables['firstUmbracoVersion'],'')
          - script: echo "##vso[task.setvariable variable=secondDotNetVersion]null"
            displayName: Set secondDotNetVersion to null if empty
            condition: eq(variables['secondDotNetVersion'],'')
          - script: echo "##vso[task.setvariable variable=secondUmbracoVersion]null"
            displayName: Set secondUmbracoVersion to null if empty
            condition: eq(variables['secondUmbracoVersion'],'')
          - script: echo "##vso[task.setvariable variable=thirdDotNetVersion]null"
            displayName: Set thirdDotNetVersion to null if empty
            condition: eq(variables['thirdDotNetVersion'],'')
          - script: echo "##vso[task.setvariable variable=thirdUmbracoVersion]null"
            displayName: Set thirdUmbracoVersion to null if empty
            condition: eq(variables['thirdUmbracoVersion'],'')
          - script: echo "##vso[task.setvariable variable=fourthDotNetVersion]null"
            displayName: Set fourthDotNetVersion to null if empty
            condition: eq(variables['fourthDotNetVersion'],'')
          - script: echo "##vso[task.setvariable variable=fourthUmbracoVersion]null"
            displayName: Set fourthUmbracoVersion to null if empty
            condition: eq(variables['fourthUmbracoVersion'],'')

          - task: PowerShell@2
            name: versionsOutput
            displayName: Convert versions to JSON
            inputs:
              filePath: '$(terraformWorkingDirectory)/script/versionsToJson.ps1'
              arguments: |
                -firstDotNetVersion $(firstDotNetVersion) -firstUmbracoVersion $(firstUmbracoVersion) -secondDotNetVersion $(secondDotNetVersion) -secondUmbracoVersion $(secondUmbracoVersion) -thirdDotNetVersion $(thirdDotNetVersion) -thirdUmbracoVersion $(thirdUmbracoVersion) -fourthDotNetVersion $(fourthDotNetVersion) -fourthUmbracoVersion $(fourthUmbracoVersion)
                echo "##vso[task.setvariable variable=umbracoTFversions;isOutput=true]$env:umbracoTFversions"

      - job: setup
        dependsOn:
          - checkResourceGroup
          - getFormattedVersions
        condition: eq(dependencies.checkResourceGroup.outputs['checkGroup.resourceGroupExists'], false)
        displayName: Terraform Plan
        variables:
          umbracoTFversions: $[dependencies.getFormattedVersions.outputs['versionsOutput.umbracoTFversions']]
        steps:
          - task: TerraformInstaller@0
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: PowerShell@2
            displayName: Terraform Init
            inputs:
              targetType: 'inline'
              script: 'terraform init -backend=false'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: >-
                -parallelism=1
                -var resource_name_prefix=${{ parameters.prefix }}
                -var resource_group_name=$(azurergname)
                -var results_storage_account_name=$(resultsStorageAccountName)
                -var app_service_plan_sku=${{ parameters.appServicePlanSku }}
                -var sql_sku=${{ parameters.sqlSku }}
                -var sql_max_size_gb=${{ parameters.sqlMaxSizeGb }}
                -var="umbraco_cms_versions=$(umbracoTFversions)"

      - job: apply
        displayName: Terraform Apply
        dependsOn:
          - getFormattedVersions
          - setup
        variables:
          umbracoTFversions: $[dependencies.getFormattedVersions.outputs['versionsOutput.umbracoTFversions']]
        steps:
          - task: TerraformInstaller@0
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: PowerShell@2
            displayName: Terraform Init
            inputs:
              targetType: 'inline'
              script: 'terraform init -backend=false'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: AzureCLI@2
            name: AzLoginInfo
            displayName: Get Azure Credentials
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "##vso[task.setvariable variable=ARM_CLIENT_ID]$servicePrincipalId"
                echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET]$servicePrincipalKey"
                echo "##vso[task.setvariable variable=ARM_TENANT_ID]$tenantId"
              addSpnToEnvironment: true

          - task: TerraformTaskV4@4
            displayName: Terraform Apply
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: >-
                -parallelism=1
                -var resource_name_prefix=${{ parameters.prefix }}
                -var resource_group_name=$(azurergname)
                -var results_storage_account_name=$(resultsStorageAccountName)
                -var client_id=$(ARM_CLIENT_ID)
                -var client_secret=$(ARM_CLIENT_SECRET)
                -var tenant_id=$(ARM_TENANT_ID)
                -var app_service_plan_sku=${{ parameters.appServicePlanSku }}
                -var sql_sku=${{ parameters.sqlSku }}
                -var sql_max_size_gb=${{ parameters.sqlMaxSizeGb }}
                -var="umbraco_cms_versions=$(umbracoTFversions)"

          - task: TerraformTaskV4@4
            displayName: Terraform Output
            inputs:
              provider: 'azurerm'
              command: 'output'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'

          - task: PowerShell@2
            name: outputVars
            displayName: Extract Output Variables
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "##vso[task.setvariable variable=firstHostName;isOutput=true]$(terraform output -json hostnames | jq -r '.[0]')"
                Write-Host "##vso[task.setvariable variable=secondHostName;isOutput=true]$(terraform output -json hostnames | jq -r '.[1]')"
                Write-Host "##vso[task.setvariable variable=thirdHostName;isOutput=true]$(terraform output -json hostnames | jq -r '.[2]')"
                Write-Host "##vso[task.setvariable variable=fourthHostName;isOutput=true]$(terraform output -json hostnames | jq -r '.[3]')"
                Write-Host "##vso[task.setvariable variable=firstUmbracoVersion;isOutput=true]$(terraform output -json cms_versions | jq -r '.[0]')"
                Write-Host "##vso[task.setvariable variable=secondUmbracoVersion;isOutput=true]$(terraform output -json cms_versions | jq -r '.[1]')"
                Write-Host "##vso[task.setvariable variable=thirdUmbracoVersion;isOutput=true]$(terraform output -json cms_versions | jq -r '.[2]')"
                Write-Host "##vso[task.setvariable variable=fourthUmbracoVersion;isOutput=true]$(terraform output -json cms_versions | jq -r '.[3]')"
                Write-Host "##vso[task.setvariable variable=firstAppServiceName;isOutput=true]$(terraform output -json app_service_name | jq -r '.[0]')"
                Write-Host "##vso[task.setvariable variable=secondAppServiceName;isOutput=true]$(terraform output -json app_service_name | jq -r '.[1]')"
                Write-Host "##vso[task.setvariable variable=thirdAppServiceName;isOutput=true]$(terraform output -json app_service_name | jq -r '.[2]')"
                Write-Host "##vso[task.setvariable variable=fourthAppServiceName;isOutput=true]$(terraform output -json app_service_name | jq -r '.[3]')"
                Write-Host "##vso[task.setvariable variable=storageAccountName;isOutput=true]$(terraform output -raw storage_account_name)"
              workingDirectory: '$(terraformWorkingDirectory)'

      - job: runLoadTest
        displayName: Run k6 Load Tests
        dependsOn: apply
        variables:
          firstHostName: $[dependencies.apply.outputs['outputVars.firstHostName']]
          secondHostName: $[dependencies.apply.outputs['outputVars.secondHostName']]
          thirdHostName: $[dependencies.apply.outputs['outputVars.thirdHostName']]
          fourthHostName: $[dependencies.apply.outputs['outputVars.fourthHostName']]
          firstUmbracoVersion: $[dependencies.apply.outputs['outputVars.firstUmbracoVersion']]
          secondUmbracoVersion: $[dependencies.apply.outputs['outputVars.secondUmbracoVersion']]
          thirdUmbracoVersion: $[dependencies.apply.outputs['outputVars.thirdUmbracoVersion']]
          fourthUmbracoVersion: $[dependencies.apply.outputs['outputVars.fourthUmbracoVersion']]
          firstAppServiceName: $[dependencies.apply.outputs['outputVars.firstAppServiceName']]
          secondAppServiceName: $[dependencies.apply.outputs['outputVars.secondAppServiceName']]
          thirdAppServiceName: $[dependencies.apply.outputs['outputVars.thirdAppServiceName']]
          fourthAppServiceName: $[dependencies.apply.outputs['outputVars.fourthAppServiceName']]
          storageAccountName: $[dependencies.apply.outputs['outputVars.storageAccountName']]
        steps:
          # Build k6 tests (once, before running tests)
          - task: Bash@3
            displayName: 'Build k6 tests'
            inputs:
              targetType: 'inline'
              script: |
                cd $(System.DefaultWorkingDirectory)/loadtests
                npm ci
                npm run build

          # Load Test 1
          - template: load-test-template.yml
            parameters:
              hostName: $(firstHostName)
              umbracoVersion: $(firstUmbracoVersion)
              appServiceName: $(firstAppServiceName)
              previousAppServiceName: ''
              testName: 'First'
              userAmount: ${{ parameters.userAmount }}
              testDuration: ${{ parameters.testDuration }}
              warmupSeconds: ${{ parameters.warmupSeconds }}
              appServiceSku: ${{ parameters.appServicePlanSku }}
              sqlSku: ${{ parameters.sqlSku }}
          
          # Load Test 2
          - template: load-test-template.yml
            parameters:
              hostName: $(secondHostName)
              umbracoVersion: $(secondUmbracoVersion)
              appServiceName: $(secondAppServiceName)
              previousAppServiceName: $(firstAppServiceName)
              testName: 'Second'
              userAmount: ${{ parameters.userAmount }}
              testDuration: ${{ parameters.testDuration }}
              warmupSeconds: ${{ parameters.warmupSeconds }}
              appServiceSku: ${{ parameters.appServicePlanSku }}
              sqlSku: ${{ parameters.sqlSku }}
          
          # Load Test 3
          - template: load-test-template.yml
            parameters:
              hostName: $(thirdHostName)
              umbracoVersion: $(thirdUmbracoVersion)
              appServiceName: $(thirdAppServiceName)
              previousAppServiceName: $(secondAppServiceName)
              testName: 'Third'
              userAmount: ${{ parameters.userAmount }}
              testDuration: ${{ parameters.testDuration }}
              warmupSeconds: ${{ parameters.warmupSeconds }}
              appServiceSku: ${{ parameters.appServicePlanSku }}
              sqlSku: ${{ parameters.sqlSku }}
          
          # Load Test 4
          - template: load-test-template.yml
            parameters:
              hostName: $(fourthHostName)
              umbracoVersion: $(fourthUmbracoVersion)
              appServiceName: $(fourthAppServiceName)
              previousAppServiceName: $(thirdAppServiceName)
              testName: 'Fourth'
              userAmount: ${{ parameters.userAmount }}
              testDuration: ${{ parameters.testDuration }}
              warmupSeconds: ${{ parameters.warmupSeconds }}
              appServiceSku: ${{ parameters.appServicePlanSku }}
              sqlSku: ${{ parameters.sqlSku }}

      - job: testSummary
        dependsOn: runLoadTest
        condition: succeededOrFailed()
        displayName: Generate Test Summary
        variables:
          firstUmbracoVersion: $[dependencies.apply.outputs['outputVars.firstUmbracoVersion']]
          secondUmbracoVersion: $[dependencies.apply.outputs['outputVars.secondUmbracoVersion']]
          thirdUmbracoVersion: $[dependencies.apply.outputs['outputVars.thirdUmbracoVersion']]
          fourthUmbracoVersion: $[dependencies.apply.outputs['outputVars.fourthUmbracoVersion']]
        steps:
          - task: PowerShell@2
            displayName: 'Generate Test Summary'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "=============================================="
                Write-Host "       LOAD TEST SUMMARY"
                Write-Host "=============================================="
                Write-Host ""
                Write-Host "Configuration:"
                Write-Host "  - App Service SKU: ${{ parameters.appServicePlanSku }}"
                Write-Host "  - SQL SKU: ${{ parameters.sqlSku }}"
                Write-Host "  - Virtual Users: ${{ parameters.userAmount }}"
                Write-Host "  - Test Duration: ${{ parameters.testDuration }}"
                Write-Host ""
                Write-Host "Versions Tested:"
                if ("$(firstUmbracoVersion)" -ne "null" -and "$(firstUmbracoVersion)" -ne "") {
                    Write-Host "  - Umbraco $(firstUmbracoVersion)"
                }
                if ("$(secondUmbracoVersion)" -ne "null" -and "$(secondUmbracoVersion)" -ne "") {
                    Write-Host "  - Umbraco $(secondUmbracoVersion)"
                }
                if ("$(thirdUmbracoVersion)" -ne "null" -and "$(thirdUmbracoVersion)" -ne "") {
                    Write-Host "  - Umbraco $(thirdUmbracoVersion)"
                }
                if ("$(fourthUmbracoVersion)" -ne "null" -and "$(fourthUmbracoVersion)" -ne "") {
                    Write-Host "  - Umbraco $(fourthUmbracoVersion)"
                }
                Write-Host ""
                Write-Host "Test reports are available in the pipeline artifacts."
                Write-Host "=============================================="

      - job: doesResourceGroupExists
        dependsOn:
          - runLoadTest
          - testSummary
        condition: succeededOrFailed()
        displayName: Check Resource Group for Cleanup
        steps:
          - task: AzureCLI@2
            name: checkResourceGroup
            displayName: Check if resource group exists
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: 'Write-Host "##vso[task.setvariable variable=doesExist;isOutput=true]$(az group exists -n $(azurergname))"'

      - job: manualValidationResourceGroup
        dependsOn: doesResourceGroupExists
        condition: eq(dependencies.doesResourceGroupExists.outputs['checkResourceGroup.doesExist'], true)
        displayName: Manual Validation - Keep Resources?
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            displayName: Wait for approval
            timeoutInMinutes: 1440
            inputs:
              instructions: |
                Press "Resume" to KEEP the resource group $(azurergname).
                Press "Reject" (or wait 24h) to DELETE the resource group and all resources.

      - job: deleteResourceGroup
        displayName: Delete Resource Group
        dependsOn: manualValidationResourceGroup
        condition: eq(dependencies.manualValidationResourceGroup.result, 'failed')
        steps:
          - task: AzureCLI@2
            displayName: Delete resource group
            retryCountOnTaskFailure: 5
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: 'az group delete -n $(azurergname) --yes'
