# Static-analysis pipeline that runs on every pull request. No Azure resources,
# no load test — just lints the things humans tend to forget locally:
#   - terraform fmt + validate
#   - PSScriptAnalyzer over scripts/ (matches the README's "local checks" rule set)
#   - python -m py_compile on loadtests/locustfile.py
#
# Wire as a build validation policy on the `main` branch in AzDO branch policies
# so it's required before merge. Typical runtime ~1 minute (no provisioning).

name: pr_validation

# CI on push is disabled — this pipeline is for PR validation only.
trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: validate
    displayName: Static checks
    jobs:
      - job: terraform
        displayName: Terraform fmt + validate
        steps:
          - task: TerraformInstaller@0
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3'

          - task: PowerShell@2
            displayName: terraform fmt -check -recursive
            inputs:
              targetType: inline
              workingDirectory: '$(System.DefaultWorkingDirectory)/Terraform'
              script: |
                $ErrorActionPreference = "Stop"
                $PSNativeCommandUseErrorActionPreference = $true
                terraform fmt -check -recursive

          - task: PowerShell@2
            displayName: terraform init + validate
            inputs:
              targetType: inline
              workingDirectory: '$(System.DefaultWorkingDirectory)/Terraform'
              script: |
                $ErrorActionPreference = "Stop"
                $PSNativeCommandUseErrorActionPreference = $true
                terraform init -backend=false
                terraform validate

      - job: powershell
        displayName: PowerShell lint
        steps:
          - task: PowerShell@2
            displayName: Install PSScriptAnalyzer
            inputs:
              targetType: inline
              script: |
                $ErrorActionPreference = "Stop"
                Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

          - task: PowerShell@2
            displayName: Invoke-ScriptAnalyzer
            inputs:
              targetType: inline
              workingDirectory: '$(System.DefaultWorkingDirectory)'
              script: |
                $ErrorActionPreference = "Stop"
                $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
                if ($results) {
                    $results | Format-Table -AutoSize
                    Write-Host "##vso[task.logissue type=error]PSScriptAnalyzer found $($results.Count) issue(s)."
                    exit 1
                }
                Write-Host "PSScriptAnalyzer passed."

      - job: python
        displayName: Python syntax check
        steps:
          - task: UsePythonVersion@0
            displayName: Use Python 3
            inputs:
              versionSpec: '3.x'

          - task: PowerShell@2
            displayName: py_compile loadtests/locustfile.py
            inputs:
              targetType: inline
              workingDirectory: '$(System.DefaultWorkingDirectory)'
              script: |
                $ErrorActionPreference = "Stop"
                $PSNativeCommandUseErrorActionPreference = $true
                python -m py_compile loadtests/locustfile.py
                Write-Host "loadtests/locustfile.py compiled cleanly."

      - job: yaml
        displayName: YAML lint
        steps:
          - task: UsePythonVersion@0
            displayName: Use Python 3
            inputs:
              versionSpec: '3.x'

          - task: PowerShell@2
            displayName: yamllint scenarios
            inputs:
              targetType: inline
              workingDirectory: '$(System.DefaultWorkingDirectory)'
              script: |
                $ErrorActionPreference = "Stop"
                $PSNativeCommandUseErrorActionPreference = $true
                pip install --quiet yamllint
                # Loose style: only complain about syntax errors, not stylistic preferences.
                yamllint -d "{rules: {document-start: disable, line-length: disable, truthy: disable}}" loadtests/scenarios/
                Write-Host "scenarios/ yaml lint OK."

      - job: json
        displayName: JSON syntax check
        steps:
          - task: PowerShell@2
            displayName: ConvertFrom-Json over tracked .json files
            inputs:
              targetType: inline
              pwsh: true
              workingDirectory: '$(System.DefaultWorkingDirectory)'
              script: |
                $ErrorActionPreference = "Stop"
                # Parses every tracked .json — Workbook, scenarios/*/appsettings.json,
                # tiers.json — to catch trailing-comma typos at PR time instead of at
                # workbook-deploy / terraform-plan time. Tracked-only (git ls-files)
                # so .terraform/ and __pycache__/ don't sneak in.
                $files = git ls-files '*.json'
                if (-not $files) {
                    Write-Host "No tracked .json files found."
                    exit 0
                }
                $bad = @()
                foreach ($f in $files) {
                    try {
                        Get-Content -LiteralPath $f -Raw -Encoding utf8 | ConvertFrom-Json -ErrorAction Stop | Out-Null
                        Write-Host "OK   $f"
                    } catch {
                        Write-Host "FAIL $f -- $($_.Exception.Message)"
                        $bad += $f
                    }
                }
                if ($bad.Count -gt 0) {
                    Write-Host "##vso[task.logissue type=error]Invalid JSON in $($bad.Count) file(s): $($bad -join ', ')"
                    exit 1
                }
                Write-Host "All $($files.Count) JSON file(s) parsed cleanly."
